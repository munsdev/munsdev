name = "socialmaker"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# The app is no longer served from here. It moved into the ElectionLog team
# hub and this Worker is a notice plus the reads a migration needs, so there
# is no built page to compile in any more and `node build.mjs` is not part of
# deploying. See src/retired.ts.

[[d1_databases]]
binding = "DB"
database_name = "socialmaker-db"
database_id = "0760dae4-a860-4e47-a25e-9c12105bbcf7"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "socialmaker-images"

# One shared password guarded against guessing. 10 attempts a minute per IP.
[[unsafe.bindings]]
name = "LOGIN_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# muns.dev is a zone on this account, so custom_domain creates the DNS record
# and cert on deploy -- a bare [[routes]] pattern would not, which is the trap
# that leaves a route configured and the hostname not resolving.
[[routes]]
pattern = "socialmaker.muns.dev"
custom_domain = true

# --- Secrets (never put these here) ---
# Set with `wrangler secret put <NAME>`:
#   GATE_PASSWORD   the one shared password
#   GATE_SECRET     random key that signs the session cookie
