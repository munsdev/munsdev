  }

  function think(a, dt, now) {
    if (a.mode) return;                       // in the lift, or waiting for it
    if (a.route) return;
    if (a.waitT > 0) { a.waitT -= dt * 16.667; return; }
    if (!a.errands.length) {
      if (!a.auto) return;                    // the worker only does what he is told
      nextErrand(a, now);
    }
    var job = a.errands.shift();
    if (!job) return;
    if (a.goTo(job.pt.x, job.pt.y)) {
      a.arriveCb = function (who) {
        if (job.act) job.act(who);
        who.waitT = job.wait;
      };
    } else {
      a.errands.length = 0;
      a.waitT = 600;
    }
  }


  /* ================= the bins ====================================================
     Each bin fills as people use it, colouring from green through to red. A full
     bin gets littered around instead, and the litterer complains. Click a bin and
     the station worker walks over and empties it.                              */

  var BIN_STEP = 0.1;                         // one deposit -- half speed to fill
  var BIN_STOPS = [[0.00, [46, 158, 58]],     // green
                   [0.40, [216, 208, 46]],    // yellow
                   [0.70, [232, 134, 46]],    // orange
                   [1.00, [208, 32, 32]]];    // red

  function binColour(f) {
    var a = BIN_STOPS[0], b = BIN_STOPS[BIN_STOPS.length - 1];
    for (var i = 0; i < BIN_STOPS.length - 1; i++) {
      if (f >= BIN_STOPS[i][0] && f <= BIN_STOPS[i + 1][0]) { a = BIN_STOPS[i]; b = BIN_STOPS[i + 1]; break; }
    }
    var t = (f - a[0]) / (b[0] - a[0] || 1), c = [0, 0, 0];
    for (var j = 0; j < 3; j++) c[j] = Math.round(a[1][j] + (b[1][j] - a[1][j]) * t);
    return "rgb(" + c.join(",") + ")";
  }

  var litterLayer = svgEl("g");
  litterLayer.style.pointerEvents = "none";
  layer1.insertBefore(litterLayer, props[0].el);       // on the ground, under everything

  var BINS = ["rect161", "rect160", "rect102", "rect101"].map(function (v) {
    var el = id(v);
    if (!el) return null;
    var b = boxIn(el);
    var bin = {
      el: el, box: b, fill: 0, litter: [], busy: false,
      stand: { x: (b.x1 + b.x2) / 2 + ((b.x1 + b.x2) / 2 < 105 ? -4.6 : 4.6), y: b.y2 + 2.5 }
    };
    el.style.fill = binColour(0);
    el.style.cursor = "pointer";
    el.addEventListener("click", function (e) {
      e.stopPropagation();
      if (bin.busy || bin.fill <= 0) return;
      if (player.goTo(bin.stand.x, bin.stand.y)) {
        player.arriveCb = function () { emptyBin(bin); };
      }
    });
    return bin;
  }).filter(Boolean);

  function dropLitter(bin) {
    if (bin.litter.length > 7) return;
    var g = svgEl("ellipse");
    var w = bin.box.x2 - bin.box.x1;
    g.setAttribute("cx", (bin.box.x1 + bin.box.x2) / 2 + rnd(-w * 1.6, w * 1.6));
    g.setAttribute("cy", bin.box.y2 + rnd(0.5, 4));
    g.setAttribute("rx", rnd(0.7, 1.4));
    g.setAttribute("ry", rnd(0.4, 0.8));
    g.setAttribute("style", "fill:" + pick(["#8d857a", "#b9b0a2", "#6f6459", "#c4bda8"]) +
                            ";stroke:#1a1a1a;stroke-width:0.25");
    litterLayer.appendChild(g);
    bin.litter.push(g);
  }

  function useBin(a, bin) {
    a.bob(600);
    if (bin.fill >= 1) {
      dropLitter(bin);
      a.grumble(1600);
      return;
    }
    bin.fill = Math.min(1, bin.fill + BIN_STEP);
    bin.el.style.fill = binColour(bin.fill);
  }

  function emptyBin(bin) {
    if (bin.busy) return;
    bin.busy = true;
    HA.noise(.5, 0, 900, .16);
    var from = bin.fill;
    var cx = (bin.box.x1 + bin.box.x2) / 2, cy = (bin.box.y1 + bin.box.y2) / 2;
    animate(1000, function (t) {
      bin.fill = from * (1 - t);
      bin.el.style.fill = binColour(bin.fill);
      var k = Math.sin(t * Math.PI * 8) * 0.5 * (1 - t);       // a shake that settles
      bin.el.setAttribute("transform",
        "translate(" + cx + "," + cy + ") rotate(" + k * 6 + ") translate(" + (-cx) + "," + (-cy) + ")");
    }, function () {
      bin.fill = 0;
      bin.el.style.fill = binColour(0);
      bin.el.removeAttribute("transform");
      while (bin.litter.length) litterLayer.removeChild(bin.litter.pop());
      bin.busy = false;
    });
  }

  /* ================= the lift =====================================================
     Two doors that retract left behind the frame, a call button that reads green
     when the car is at that floor and red when it is not, and room for four. It
     runs itself: it goes where it is called, opens, swaps its load, and closes. */

  var LIFT_CAPACITY = 4;
  var LIFT_DOOR_MS  = 700, LIFT_DWELL_MS = 1600, LIFT_TRAVEL_MS = 2600;
  var DOOR_SLIDE    = 15.499;                 // both panels, right back into the wall

  var LIFT = (function () {
    var pclip = svgEl("clipPath");
    pclip.setAttribute("id", "liftpocket");
    pclip.setAttribute("clipPathUnits", "userSpaceOnUse");
    var prect = svgEl("rect");
    prect.setAttribute("x", 89.955); prect.setAttribute("y", 178.5);
    prect.setAttribute("width", 31.363); prect.setAttribute("height", 27.2);
    pclip.appendChild(prect);
    defs.appendChild(pclip);

    function floorOf(groupId, dy, level, wait, door) {
      var g = id(groupId);
      if (!g) return null;
      var doors = [];
      var kids = g.querySelectorAll("path");
      for (var i = 0; i < kids.length; i++) {
        var lb = kids[i].getAttribute("inkscape:label");
        if (lb === "Door1" || lb === "Door2") doors.push(kids[i]);
      }
      // Pocket the doors: they retract past the frame, so they get clipped to
      // the doorway or they would slide out into the open on the left.
      var back = svgEl("rect");                  // solid wall behind the car
      back.setAttribute("x", 89.955); back.setAttribute("y", 178.9);
      back.setAttribute("width", 31.363); back.setAttribute("height", 26.5);
      back.setAttribute("style", "fill:#3f4a48;stroke:none");
      g.insertBefore(back, g.firstChild);

      var pocket = svgEl("g");
      pocket.setAttribute("clip-path", "url(#liftpocket)");
      if (doors.length) {
        doors[0].parentNode.insertBefore(pocket, doors[0]);
        doors.forEach(function (d) { pocket.appendChild(d); });
      }
      var slots = [];
      for (var s = 0; s < LIFT_CAPACITY; s++) {
        slots.push({ x: 101.0 + s * 3.6, y: door.carY });
      }
      return { group: g, doors: doors, pocket: pocket, button: g.querySelector("circle"),
               level: level, wait: wait, door: door, slots: slots, zone: door.zone };
    }
    var top = floorOf("g14", 0, "surface",
                      { x: 105.58, y: 209.5 },
                      { x: 105.58, y: 208.0, carY: 203.4, zone: LIFTZONE.top });
    var bottom = floorOf("g8", 59.843284, "ubahn",
                         { x: 105.58, y: 272 },
                         { x: 105.58, y: 269.5, carY: 263.2, zone: LIFTZONE.bottom });
    if (!top || !bottom) return null;

    var L = {
      at: "top", state: "idle", t: 0, open: 0,
      riders: [], queue: { top: [], bottom: [] },
      floors: { top: top, bottom: bottom }
    };

    function paint() {
      ["top", "bottom"].forEach(function (k) {
        var f = L.floors[k];
        var here = (L.at === k && L.state !== "moving");
        if (f.button) f.button.style.fill = here ? "#3ecf4a" : "#d02020";
        var slide = (L.at === k) ? -DOOR_SLIDE * L.open : 0;
        f.doors.forEach(function (d) {
          d.setAttribute("transform", "translate(" + slide + ",0)");
        });
        var walkIn = here && L.open > 0.6;
        if (f.zone.open !== walkIn) {          // the doorway just became floor, or stopped being
          f.zone.open = walkIn;
          clearWalkCache();
        }
      });
    }
    L.paint = paint;
    paint();

    L.other = function () { return L.at === "top" ? "bottom" : "top"; };
    L.floorFor = function (level) { return level === "ubahn" ? "bottom" : "top"; };

    LIFTZONE.carDepth = function (px, py) {
      for (var k in L.floors) {
        var f = L.floors[k];
        if (px >= f.zone.dx1 && px <= f.zone.dx2 && py >= f.zone.cy1 && py <= f.zone.y2) {
          return { parent: f.group, before: f.pocket };
        }
      }
      return null;
    };

    L.call = function (a, destFloor) {
      if (L.broken) return false;
      a.mode = "lift";
      a.liftDest = destFloor;
      var here = L.floorFor(a.level);
      if (L.queue[here].indexOf(a) < 0) L.queue[here].push(a);
    };
    L.roomLeft = function () { return LIFT_CAPACITY - L.riders.length; };
    L.waitingAt = function (k) { return L.queue[k].length; };

    // People walk in and out on their own feet and stay visible in the car.
    function freeSlot(f) {
      for (var i = 0; i < f.slots.length; i++) {
        var taken = false;
        for (var j = 0; j < L.riders.length; j++) if (L.riders[j].slotIx === i) taken = true;
        if (!taken) return i;
      }
      return -1;
    }
    function board() {
      var f = L.floors[L.at];
      for (var i = L.riders.length - 1; i >= 0; i--) {
        var r = L.riders[i];
        if (r.liftDest !== L.at || r.mode === "leaving") continue;
        L.riders.splice(i, 1);
        r.slotIx = -1;
        r.mode = "leaving";
        r.level = f.level;
        r.lane = null;
        if (!r.goTo(f.wait.x + rnd(-4, 4), f.wait.y)) {
          r.x = f.wait.x; r.y = f.wait.y; r.mode = null; r.apply();
        } else {
          r.arriveCb = function (who) { who.mode = null; };
        }
      }
      var q = L.queue[L.at];
      while (q.length && L.riders.length < LIFT_CAPACITY) {
        var a = q.shift();
        if (a.mode !== "lift") continue;
        var ix = freeSlot(f);
        if (ix < 0) { q.unshift(a); break; }
        a.slotIx = ix;
        a.mode = "boarding";
        L.riders.push(a);
        (function (who, floor, slotIx) {
          if (!who.goTo(floor.slots[slotIx].x, floor.slots[slotIx].y)) {
            who.x = floor.slots[slotIx].x; who.y = floor.slots[slotIx].y;
            who.mode = "riding"; who.apply();
          } else {
            who.arriveCb = function (w) { w.mode = "riding"; };
          }
        })(a, f, ix);
      }
    }
    function allAboard() {
      for (var i = 0; i < L.riders.length; i++) {
        if (L.riders[i].mode === "boarding") return false;
      }
      return true;
    }
    function carryRiders() {                    // the car has arrived, bring its load
      var f = L.floors[L.at];
      L.riders.forEach(function (r) {
        var s = f.slots[Math.max(0, r.slotIx)];
        r.stop();
        r.x = s.x; r.y = s.y; r.level = f.level; r.lane = null;
        r.mode = "riding";
        r.apply();
      });
    }
    // anyone standing in the car when the doors shut rides along, player included
    function sweep() {
      var f = L.floors[L.at];
      allActors().forEach(function (a) {
        if (a.mode === "riding" || a.mode === "boarding" || a.mode === "leaving") return;
        if (a.x < f.zone.dx1 || a.x > f.zone.dx2) return;
        if (a.y < f.zone.cy1 || a.y > f.zone.y2) return;
        if (L.riders.length >= LIFT_CAPACITY) return;
        a.stop();
        a.slotIx = freeSlot(f);
        a.mode = "riding";
        a.liftDest = L.other();
        L.riders.push(a);
      });
    }

    // The car is solid once it shuts, so nothing may be left inside that is not
    // riding. Anyone else gets put back out on the landing.
    function evict() {
      var f = L.floors[L.at];
      allActors().forEach(function (a) {
        if (a.mode === "riding" || a.mode === "boarding") return;
        if (a.x < f.zone.dx1 - 1 || a.x > f.zone.dx2 + 1) return;
        if (a.y < f.zone.cy1 - 1 || a.y > f.zone.y2 + 1) return;
        a.stop();
        a.mode = null;
        a.x = f.wait.x + rnd(-3, 3);
        a.y = f.wait.y;
        a.level = f.level;
        a.lane = null;
        a.apply();
      });
    }
    L.evict = evict;

    L.tick = function (dt) {
      var ms = dt * 16.667;
      L.t -= ms;
      switch (L.state) {
        case "idle":
          if (L.broken) break;
          if (L.waitingAt(L.at) || L.riders.length) { L.state = "opening"; L.t = LIFT_DOOR_MS; L.served = true; }
          else if (L.waitingAt(L.other())) { L.state = "moving"; L.t = LIFT_TRAVEL_MS; paint(); }
          break;
        case "opening":
          L.open = 1 - Math.max(0, L.t) / LIFT_DOOR_MS;
          paint();
          if (L.t <= 0) { L.open = 1; L.state = "open"; L.t = LIFT_DWELL_MS; board(); paint(); }
          break;
        case "open":
          if (L.waitingAt(L.at) && L.riders.length < LIFT_CAPACITY) board();
          if (L.t <= 0 && allAboard()) { sweep(); L.state = "closing"; L.t = LIFT_DOOR_MS; }
          else if (L.t < -4000) { L.state = "closing"; L.t = LIFT_DOOR_MS; }
          break;
        case "closing":
          L.open = Math.max(0, L.t) / LIFT_DOOR_MS;
          paint();
          if (L.t <= 0) {
            L.open = 0;
            paint();
            sweep();                            // catch anyone who stepped in late
            evict();                            // and put out whoever cannot ride
            if (L.broken) { L.state = "idle"; break; }
            if (L.riders.length || L.waitingAt(L.other())) { L.state = "moving"; L.t = LIFT_TRAVEL_MS; paint(); }
            else {
              L.state = "idle";
              if (L.served && Math.random() < LIFT_BREAK_CHANCE && L.breakDown) {
                L.served = false;
                L.breakDown();
              }
            }
          }
          break;
        case "moving":
          if (L.t <= 0) {
            L.at = L.other();
            carryRiders();
            L.state = "opening"; L.t = LIFT_DOOR_MS;
            HA.tone({ f: 880, dur: .12, type: "sine", vol: .12 });
            paint();
          }
          break;
      }
    };
    return L;
  })();

  /* ---- how the regulars decide to change level ---- */

  function levelOfPt(pt) { return levelOfPoint(pt.x, pt.y).level; }

  function travelTo(a, pt, wait, act) {
    var here = a.level === "shaft" ? "surface" : a.level;
    var there = levelOfPt(pt);
    var needsLift = a.liftOnly ||
                    (a.liftPrefers && LIFT && LIFT.waitingAt(LIFT.floorFor(here)) < 2);

    if (LIFT && LIFT.broken && a.liftOnly && there !== here) return false;   // stranded, pick something else
    if (LIFT && there !== here && (needsLift || a.liftOnly)) {
      var destFloor = LIFT.floorFor(there);
      var f = LIFT.floors[LIFT.floorFor(here)];
      a.errands.push({ pt: { x: f.wait.x + rnd(-3, 3), y: f.wait.y },
                       wait: 0,
                       act: function (who) { LIFT.call(who, destFloor); } });
    }
    a.errands.push({ pt: pt, wait: wait, act: act });
    return true;
  }

  /* ================= bus and ubahn services, and the clock for all of them ===== */

  // Two a side, double size, so they are easy to hit with a thumb. The left pair
  // use the left hand sign shape and the right pair the right hand one, so none
  // of them read backwards.
  var BADGE_SCALE = 2;
  var LEFT_X = 16, RIGHT_X = -210;            // put each shape flush to its edge
  var ROW_1 = -216, ROW_2 = -180;             // tops at y 8 and y 44

  var redBadge   = placeBadge("g31", LEFT_X,  ROW_1, BADGE_SCALE, "#c83737", "#1a1a1a", false);
  var ubahnBadge = placeBadge("g31", LEFT_X,  ROW_2, BADGE_SCALE, "#ffcc00", "#1a1a1a", true);
  var blueBadge  = placeBadge("g37", RIGHT_X, ROW_1, BADGE_SCALE, "#3771c8", "#1a1a1a", false);
  var busBadge   = placeBadge("g37", RIGHT_X, ROW_2, BADGE_SCALE, "#22b14c", "#1a1a1a", true);

  SERVICES.forEach(function (s) {
    if (s.key === "red")  s.badge = redBadge;
    if (s.key === "blue") s.badge = blueBadge;
    if (s.badge) {
      s.pieEl = s.badge.pie; s.textEl = s.badge.text;
      s.cx = s.badge.cx; s.cy = s.badge.cy; s.r = s.badge.r;
    }
  });

  addSlider("bus",   "g219", busBadge,   60000, 45000, 9000, { x: 40, y: 213 });
  addSlider("ubahn", "g22",  ubahnBadge, 60000, 15000, 9000, { x: 70, y: 272 });
  SERVICES.forEach(function (s) {
    if (s.badge) { s.cx = s.badge.cx; s.cy = s.badge.cy; s.r = s.badge.r; }
  });

  // Vehicles arrive on the timetable, but they do not leave until you send them.
  // When the stop time is up they flash, and a tap dispatches them.
  var FLASH_HZ = 3;
  var BLINK_DELAY = 3000;                 // grace period before the sign starts blinking

  SERVICES.forEach(function (s) {
    s.state = "away";
    s.t = 0;
    s.next = s.offset;                      // first slot
    var hit = s.badge && s.badge.holder;
    if (!hit) return;
    s.hitEl = hit;
    hit.style.cursor = "pointer";
    hit.addEventListener("click", function (e) {
      e.stopPropagation();
      if (s.state !== "ready") return;
      hit.style.opacity = "";
      s.state = "leaving";
      s.t = LEAVE_MS;
      HA.tone({ f: 330, to: 220, dur: .4, type: "sawtooth", vol: .18 });
      departService(s);
    });
  });

  function slotAfter(s, now) {              // next 30 second slot for this service
    var k = Math.ceil((now - s.offset) / s.period);
    return s.offset + k * s.period;
  }

  function serviceTick(now, dt) {
    var ms = dt * 16.667;
    for (var i = 0; i < SERVICES.length; i++) {
      var s = SERVICES[i];
      s.t -= ms;

      switch (s.state) {
        case "away":
          if (now >= s.next) { s.state = "arriving"; s.t = ARRIVE_MS; HA.noise(.7, 0, 340, .1); }
          break;
        case "arriving":
          if (s.t <= 0) { s.state = "dwell"; s.t = s.dwell; loadService(s); }
          break;
        case "dwell":
          if (s.t <= 0) { s.state = "ready"; s.readyAt = now; boardWaiting(s); HA.stationChime(); }
          break;
        case "ready":
          break;                            // waiting for you
        case "leaving":
          if (s.t <= 0) {
            s.state = "away";
            s.next = slotAfter(s, now + 2000);
          }
          break;
      }

      var f = 1;
      if (s.state === "arriving") f = 1 - Math.max(0, s.t) / ARRIVE_MS;
      else if (s.state === "leaving") f = Math.max(0, s.t) / LEAVE_MS;
      else if (s.state === "away") f = 0;
      if (s.kind === "train") {
        s.at(f);                                   // 1 at the platform, 0 in the tunnel
      } else if (s.state === "arriving") {
        s.at(f, false);
      } else if (s.state === "leaving") {
        s.at(1 - f, true);                         // 0 at the platform, 1 off the left
      } else if (s.state === "away") {
        s.at(1, true);
      } else {
        s.at(1, false);                            // standing at the stop
      }

      // it sits there for a moment before it starts nagging
      if (s.hitEl) {
        if (s.state === "ready" && now - s.readyAt > BLINK_DELAY) {
          var on = Math.floor(now / (1000 / FLASH_HZ / 2)) % 2 === 0;
          s.hitEl.style.opacity = on ? "1" : "0.35";
        } else if (s.hitEl.style.opacity) {
          s.hitEl.style.opacity = "";
        }
      }

      // the clock counts down to when it is due out, not when it turns up
      var left;
      if (s.state === "away")          left = Math.max(0, s.next - now) + ARRIVE_MS + s.dwell;
      else if (s.state === "arriving") left = Math.max(0, s.t) + s.dwell;
      else if (s.state === "dwell")    left = Math.max(0, s.t);
      else                             left = 0;

      if (s.textEl) {
        var label = s.state === "ready" ? "GO" : String(Math.ceil(left / 1000));
        if (s.textEl.textContent !== label) s.textEl.textContent = label;
      }
      if (s.pieEl) {
        var frac = s.state === "ready" ? 1 : Math.min(1, left / s.period);
        s.pieEl.setAttribute("d", wedge(s.cx, s.cy, s.r, frac));
      }
    }
  }

  function releaseRiders(s) {
    while (s.riders.length) {
      var r = s.riders.pop();
      r.show();
      r.x = s.board.x + rnd(-4, 4);
      r.y = s.board.y;
      r.mode = null;
      r.apply();
    }
  }
  function boardWaiting(s) {
    for (var i = s.queue.length - 1; i >= 0; i--) {
      var a = s.queue[i];
      if (a.mode !== "queued" || Math.hypot(a.x - s.board.x, a.y - s.board.y) > 12) continue;
      s.queue.splice(i, 1);
      a.stop();
      if (a.dropTicket) a.dropTicket();
      a.hide();
      a.mode = "aboard";
      s.riders.push(a);
    }
  }
  function loadService(s) {
    releaseRiders(s);
    boardWaiting(s);
  }
  function departService(s) {
    for (var i = s.queue.length - 1; i >= 0; i--) {
      if (s.queue[i].mode === "queued") { s.queue[i].mode = null; s.queue.splice(i, 1); }
    }
  }

  function errandRide(a) {
    var s = null;
    if (a.ticket) {
      for (var i = 0; i < SERVICES.length; i++) if (SERVICES[i].key === a.ticket) s = SERVICES[i];
    }
    if (!s) s = pick(SERVICES);
    travelTo(a, { x: s.board.x + rnd(-4, 4), y: s.board.y }, 0, function (who) {
      who.mode = "queued";
      s.queue.push(who);
    });
  }

  /* ================= things that go wrong, and the man who fixes them ===========
     The lift breaks, the ticket machine jams, the toilets get filthy and the cafe
     needs someone behind the counter. Each one is a tap job for the worker.    */

  var GRIME_LAYER = svgEl("g");
  GRIME_LAYER.style.pointerEvents = "none";
  layer1.insertBefore(GRIME_LAYER, props[0].el);

  function jobSpot(a, pt, cb) {                 // send the worker, then do the thing
    if (player.goTo(pt.x, pt.y)) player.arriveCb = cb;
  }
  // Several of these groups carry their own transform, so the wobble is
  // prepended to it rather than replacing it, which is what threw the ticket
  // machine across the platform.
  function shake(el, ms, amount) {
    var base = el.getAttribute("transform") || "";
    var t0 = null;
    (function step(now) {
      if (t0 === null) t0 = now;
      var t = (now - t0) / ms;
      if (t >= 1) {
        if (base) el.setAttribute("transform", base); else el.removeAttribute("transform");
        return;
      }
      var dx = Math.sin(t * Math.PI * 14) * amount * (1 - t);
      el.setAttribute("transform", "translate(" + dx + ",0) " + base);
      requestAnimationFrame(step);
    })(0);
  }

  /* ---- the toilets get dirty, one side at a time ---- */

  var WCPROP = propByKey("g98");
  var STALLS = DOORS.map(function (d) {
    return { door: d, dirt: 0, marks: [], haze: null,
             clean: { x: d.cx, y: baseAt(WCPROP, d.cx) + 4 } };
  });

  function soil(stall, amount) {
    stall.dirt = Math.min(1, stall.dirt + amount);
    var want = Math.round(stall.dirt * 6);
    while (stall.marks.length < want) {
      var e = svgEl("ellipse");
      e.setAttribute("cx", stall.door.cx + rnd(-3.4, 3.4));
      e.setAttribute("cy", baseAt(WCPROP, stall.door.cx) + rnd(0.5, 5));
      e.setAttribute("rx", rnd(0.8, 1.8));
      e.setAttribute("ry", rnd(0.5, 1.0));
      e.setAttribute("style", "fill:" + pick(["#6f6a4a", "#7d7355", "#5d5a3f"]) +
                              ";stroke:none;opacity:0.85");
      GRIME_LAYER.appendChild(e);
      stall.marks.push(e);
    }
    if (stall.dirt > 0.6 && !stall.haze) {
      var h = svgEl("ellipse");
      h.setAttribute("cx", stall.door.cx);
      h.setAttribute("cy", baseAt(WCPROP, stall.door.cx) - 4);
      h.setAttribute("rx", 5); h.setAttribute("ry", 4);
      h.setAttribute("style", "fill:#8fb14a;stroke:none;opacity:0.28");
      GRIME_LAYER.appendChild(h);
      stall.haze = h;
    }
  }
  function scrub(stall) {
    while (stall.marks.length) GRIME_LAYER.removeChild(stall.marks.pop());
    if (stall.haze) { GRIME_LAYER.removeChild(stall.haze); stall.haze = null; }
    stall.dirt = 0;
    HA.tone({ f: 784, dur: .12, type: "sine", vol: .1 });
    HA.tone({ f: 1046, at: .1, dur: .18, type: "sine", vol: .1 });
  }
  var WCMID = STALLS.length === 2 ? (STALLS[0].door.cx + STALLS[1].door.cx) / 2 : 0;

  STALLS.forEach(function (stall) {
    stall.inside = { x: stall.door.cx + (stall.door.cx < WCMID ? 2.5 : -2.5), y: 0 };
    stall.inside.y = baseAt(WCPROP, stall.inside.x) - 6;
  });

  // Tap the WC building itself -- a single, much bigger and more forgiving
  // target than the individual stall doors were -- and the worker walks
  // over and cleans whichever side(s) actually need it, one after another.
  if (WCPROP) {
    WCPROP.el.style.cursor = "pointer";
    WCPROP.el.addEventListener("click", function (e) {
      e.stopPropagation();
      if (player.mode) return;
      var dirty = STALLS.filter(function (s) { return s.dirt > 0; });
      if (!dirty.length) return;
      player.stop();
      player.errands.length = 0;
      dirty.forEach(function (stall) {
        // in through the door, clean it, back out
        player.errands.push({ pt: { x: stall.door.cx, y: baseAt(WCPROP, stall.door.cx) - 1 }, wait: 120 });
        player.errands.push({ pt: stall.inside, wait: 900,
                              act: function (who) { who.bob(700); scrub(stall); } });
        player.errands.push({ pt: stall.clean, wait: 0 });
      });
    });
  }

  /* ---- the lift breaks, and gets a warning sign ---- */

  var LIFT_BREAK_CHANCE = 0.22;
  if (LIFT) {
    LIFT.broken = false;
    ["top", "bottom"].forEach(function (k) {
      var f = LIFT.floors[k];
      var sign = svgEl("g");
      sign.style.display = "none";
      var back = svgEl("rect");
      back.setAttribute("x", 98.6); back.setAttribute("y", 179.3);
      back.setAttribute("width", 14); back.setAttribute("height", 3.7);
      back.setAttribute("style", "fill:#f2c200;stroke:#1a1a1a;stroke-width:0.5");
      sign.appendChild(back);
      for (var i = 0; i < 5; i++) {
        var bar = svgEl("path");
        var x = 99.2 + i * 2.8;
        bar.setAttribute("d", "m " + x + ",183 l 1.5,-3.7 h 1.3 l -1.5,3.7 z");
        bar.setAttribute("style", "fill:#1a1a1a;stroke:none");
        sign.appendChild(bar);
      }
      f.group.appendChild(sign);
      f.sign = sign;
      f.group.style.cursor = "pointer";
      f.group.addEventListener("click", function (e) {
        e.stopPropagation();
        if (LIFT.broken) {
          jobSpot(player, f.wait, function () {
            shake(f.group, 1200, 0.7);
            animate(1200, function () {}, function () {
              LIFT.broken = false;
              LIFT.floors.top.sign.style.display = "none";
              LIFT.floors.bottom.sign.style.display = "none";
              LIFT.paint();
            });
          });
          return;
        }
        // otherwise the worker rides it
        if (player.mode) return;
        if (player.goTo(f.wait.x + rnd(-3, 3), f.wait.y)) {
          player.arriveCb = function (who) {
            if (!LIFT.broken) LIFT.call(who, k === "top" ? "bottom" : "top");
          };
        }
      });
    });
    LIFT.breakDown = function () {
      LIFT.broken = true;
      HA.tone({ f: 220, to: 140, dur: .5, type: "square", vol: .2 });
      HA.tone({ f: 220, to: 140, dur: .5, at: .55, type: "square", vol: .2 });
      shake(LIFT.floors.top.group, 900, 0.9);
      shake(LIFT.floors.bottom.group, 900, 0.9);
      LIFT.floors.top.sign.style.display = "";
      LIFT.floors.bottom.sign.style.display = "";
      LIFT.paint();
    };
  }

  /* ---- the ticket machine ---- */

  var TICKET_COLOURS = { red: "#c1272d", blue: "#1f6fbf", bus: "#22b14c", ubahn: "#ffcc00" };
  var MACHINE = { broken: false, queue: [], el: id("g223"),
                  serveAt: { x: 105, y: 152 } };
  if (MACHINE.el) {
    MACHINE.el.style.cursor = "pointer";
    MACHINE.el.addEventListener("click", function (e) {
      e.stopPropagation();
      if (!MACHINE.broken) return;
      jobSpot(player, MACHINE.serveAt, function () {
        shake(MACHINE.el, 1200, 0.8);
        animate(1200, function () {}, function () {
          MACHINE.broken = false;
          HA.tone({ f: 660, to: 990, dur: .3, type: "triangle", vol: .18 });
        });
      });
    });
  }

  /* ---- the cafe counter ---- */

  var CAFE_QUEUE = [{ x: 191, y: 167.5 }, { x: 194.5, y: 171 }, { x: 198, y: 174.5 }];
  var CAFE = { queue: [], el: id("g96"), timer: 0, busy: false,
               hatch: { x: 196.5, y: 170 } };          // where the cup comes over

  // The barista hands one across, cup and all, then the queue shuffles up.
  function serveCoffee() {
    var got = CAFE.queue[0];
    if (!got) return;
    CAFE.busy = true;
    HA.tone({ f: 587, dur: .15, type: "sine", vol: .14 });
    HA.tone({ f: 784, at: .12, dur: .2, type: "sine", vol: .12 });
    var fly = svgEl("path");
    fly.setAttribute("d", "m -1.55,-2.2 h 3.1 l -0.45,4.3 h -2.2 z");
    fly.setAttribute("style", "fill:#f4f1e8;stroke:#1a1a1a;stroke-width:0.8");
    layer1.appendChild(fly);
    var sx = CAFE.hatch.x, sy = CAFE.hatch.y;
    animate(650, function (t) {
      var tx = sx + (got.x - sx) * t;
      var ty = sy + (got.y - 6 - sy) * t - Math.sin(t * Math.PI) * 2.5;
      fly.setAttribute("transform", "translate(" + tx + "," + ty + ") scale(" + (0.8 + 0.2 * t) + ")");
    }, function () {
      layer1.removeChild(fly);
      CAFE.queue.shift();
      got.giveCup(CLOCK);
      got.mode = null;
      got.waitT = 400;
      got.bob(400);
      for (var i = 0; i < CAFE.queue.length; i++) {      // everyone moves up one
        var spot = CAFE_QUEUE[Math.min(i, CAFE_QUEUE.length - 1)];
        var w = CAFE.queue[i];
        w.mode = null;
        w.errands.unshift({ pt: spot, wait: 0, act: function (who) {
          who.mode = "cafeq";
          if (CAFE.queue.indexOf(who) < 0) CAFE.queue.push(who);
        } });
      }
      CAFE.busy = false;
      CAFE.timer = 0;
    });
  }

  /* ---- the errands that use all of the above ---- */

  function errandCafe(a) {
    if (a.hasCup) return false;
    var spot = CAFE_QUEUE[Math.min(CAFE.queue.length, CAFE_QUEUE.length - 1)];
    travelTo(a, { x: spot.x, y: spot.y }, 0, function (who) {
      who.mode = "cafeq";
      who.patience = 22000;
      CAFE.queue.push(who);
    });
    return true;
  }
  function errandTicket(a) {
    if (a.ticket) return false;
    travelTo(a, pick(TICKETS), 0, function (who) {
      who.mode = "ticketq";
      who.patience = 18000;
      MACHINE.queue.push(who);
    });
    return true;
  }

  // Whatever brought him in there, being inside a stall cleans that side.
  function wcTick(ms) {
    for (var i = 0; i < STALLS.length; i++) {
      var stall = STALLS[i];
      if (stall.dirt <= 0 || !stall.inside) { stall.dwell = 0; continue; }
      var near = player.level === "surface" &&
                 Math.hypot(player.x - stall.inside.x, player.y - stall.inside.y) < 5;
      if (!near) { stall.dwell = 0; continue; }
      stall.dwell = (stall.dwell || 0) + ms;
      if (stall.dwell > 400) {
        stall.dwell = 0;
        player.bob(600);
        scrub(stall);
      }
    }
  }

  function jobsTick(dt) {
    var ms = dt * 16.667;
    wcTick(ms);

    // the machine hands out tickets unless it has jammed
    for (var i = MACHINE.queue.length - 1; i >= 0; i--) {
      var a = MACHINE.queue[i];
      if (a.mode !== "ticketq") { MACHINE.queue.splice(i, 1); continue; }
      a.patience -= ms;
      if (!MACHINE.broken && a.patience < 15000) {
        MACHINE.queue.splice(i, 1);
        var svc = pick(SERVICES);
        a.giveTicket(svc.key, TICKET_COLOURS[svc.key] || "#cccccc");
        a.mode = null;
        a.waitT = 400;
        if (Math.random() < 0.06) {                            // jams now and then
          MACHINE.broken = true;
          HA.tone({ f: 200, dur: .35, type: "sawtooth", vol: .18 });
        }
      } else if (a.patience <= 0) {
        MACHINE.queue.splice(i, 1);
        a.grumble(2200);
        a.mode = null;
      } else if (MACHINE.broken && a.patience < 12000 && Math.random() < 0.01) {
        a.grumble(1400);
      }
    }

    // the cafe serves itself, one customer at a time
    for (var j = CAFE.queue.length - 1; j >= 0; j--) {
      var c = CAFE.queue[j];
      if (c.mode !== "cafeq") { CAFE.queue.splice(j, 1); continue; }
      c.patience -= ms;
      if (c.patience <= 0) {
        CAFE.queue.splice(j, 1);
        c.grumble(2200);
        c.mode = null;
      }
    }
    if (!CAFE.busy && CAFE.queue.length) {
      var front = CAFE.queue[0];
      if (Math.hypot(front.x - CAFE_QUEUE[0].x, front.y - CAFE_QUEUE[0].y) < 6) {
        CAFE.timer += ms;
        if (CAFE.timer > 1400) serveCoffee();
      }
    } else if (!CAFE.queue.length) {
      CAFE.timer = 0;
    }
  }

  /* ================= the clock =================================================== */

  var last = 0, sbahnRaf = null;
  function sbahnTick(now) {
    CLOCK = now;
    var dt = last ? Math.min(3, (now - last) / 16.667) : 1;
    last = now;

    var drive = { x: (keys.r ? 1 : 0) - (keys.l ? 1 : 0),
                  y: (keys.d ? 1 : 0) - (keys.u ? 1 : 0) };
    player.advance(dt, drive);
    think(player, dt, now);
    var pdip = player.bobOffset(dt);
    if (pdip !== player.dip) { player.dip = pdip; player.apply(); }

    for (var i = 0; i < crowd.length; i++) {
      var a = crowd[i];
      a.advance(dt, null);
      var dip = a.bobOffset(dt);
      if (dip !== a.dip) { a.dip = dip; a.apply(); }
      a.grumbleTick(dt);
      think(a, dt, now);
    }
    if (LIFT) { LIFT.tick(dt); if (LIFT.state === "moving" && LIFT.evict) LIFT.evict(); }
    serviceTick(now, dt);
    jobsTick(dt);
    sbahnRaf = requestAnimationFrame(sbahnTick);
  }
  // Only ticks while this screen is the one showing -- started and
  // stopped from the main app's screen switcher, same as the train
  // and lift loops.
  window.sbahnStart = function () {
    if (sbahnRaf != null) return;
    last = 0;
    sbahnRaf = requestAnimationFrame(sbahnTick);
  };
  window.sbahnStop = function () {
    if (sbahnRaf != null) { cancelAnimationFrame(sbahnRaf); sbahnRaf = null; }
  };
}
window.sbahnInit = initSbahnChaos;
</script>
</body>
</html>
