        '<div class="vpart l-band1"></div><div class="vpart l-band2"></div>' +
        '<div class="vpart l-smokebox"></div><div class="vpart l-smokebox-ring"></div>' +
        '<div class="vpart l-dome"></div><div class="vpart l-dome-cap"></div><div class="vpart l-sand"></div>' +
        '<div class="vpart l-stack"></div><div class="vpart l-stack-flare"></div><div class="vpart l-stack-lip"></div>' +
        '<div class="vpart l-lamp-bracket"></div><div class="vpart l-lamp"></div>' +
        '<div class="vpart l-beam"></div><div class="vpart l-catcher"></div>' +
        '<div class="vpart l-rod"></div>' +
        wheelHtml("l-d1",1) + wheelHtml("l-d2",1) + wheelHtml("l-d3",1) + wheelHtml("l-lead",1) +
        '<div class="vpart l-cab-win"></div>';
    }
    if(v.art === "tender"){
      return '<div class="vpart t-frame"></div><div class="vpart t-coal"></div><div class="vpart t-coal2"></div>' +
        '<div class="vpart t-body"></div><div class="vpart t-body-hi"></div><div class="vpart t-lip"></div>' +
        wheelHtml("t-w1",1) + wheelHtml("t-w2",1);
    }
    return '<div class="vpart c-frame"></div><div class="vpart c-body"></div><div class="vpart c-stripe"></div>' +
      '<div class="vpart c-win cw1"></div><div class="vpart c-win cw2"></div>' +
      '<div class="vpart c-win cw3"></div><div class="vpart c-win cw4"></div>' +
      '<div class="vpart c-door"></div><div class="vpart c-roof"></div><div class="vpart c-roof-hi"></div>' +
      wheelHtml("c-wh1",1) + wheelHtml("c-wh2",1);
  }

  let vehicles = [];
  function buildTrain(setKey){
    vehicles.forEach(function(veh){ veh.el.remove(); });
    vehicles = TRAIN_SETS[setKey].cars.map(function(v){
      const el = document.createElement("div");
      el.className = "vehicle";
      if(v.vars){
        Object.keys(v.vars).forEach(function(k){ el.style.setProperty("--" + k, v.vars[k]); });
      }
      el.innerHTML = '<div class="art" style="width:' + v.w + 'px;height:' + ART_H + 'px">' + artFor(v) + "</div>";
      el.style.cursor = "pointer";
      onTap(el, function(){ cycleTrain(); });
      trainStage.insertBefore(el, controlCard);
      return { el:el, v:v, offsetPx:0 };
    });
    // Spacing runs between real body edges, not axle positions: a vehicle's
    // reference point is its box centre, so the distance from one centre to
    // the next is (half the leader behind its centre) + gap + (half of this
    // one ahead of its centre).
    let acc = 0;
    for(let i = 1; i < vehicles.length; i++){
      const ahead = vehicles[i-1].v, self = vehicles[i].v;
      acc += (ahead.w/2 - ahead.back) + COUPLING + (self.front - self.w/2);
      vehicles[i].offsetPx = acc;
    }
    setWheelSpeed();
    place();
    // Fallback for browsers without overflow:clip -- undo any scroll the
    // focus ring may have caused when the picker was tapped.
    const trainScreen = $("#train");
    trainScreen.scrollLeft = 0;
    trainScreen.scrollTop = 0;
  }

  let trainDirection = 0, trainSpeed = 35;
  let trainRafId = null, trainLastTs = null, chuffAccum = 0;
  let pathEl = null, pathLen = 0, scale = 1, headLen = 0;
  const SPEED_PX = 120; // px along the rail per second at full throttle

  function layoutTrack(){
    const w = trainStage.clientWidth, h = trainStage.clientHeight;
    if(w < 20 || h < 20) return;
    scale = Math.max(0.32, Math.min(0.46, Math.min(w, h) / 620));
    // Generous corners: a rigid wagon chords across a curve, so a tight
    // radius is what lifts wheels off the rail. Inset must also clear the
    // body standing off the rail, or the train would hang off the screen.
    const inset = Math.max(PERP_ABOVE * scale + 18, Math.min(w, h) * 0.17);
    const x0 = inset, y0 = inset, x1 = w - inset, y1 = h - inset;
    const r = Math.min(90, (x1 - x0) / 2, (y1 - y0) / 2);
    const d = "M " + (x0+r) + " " + y0 + " L " + (x1-r) + " " + y0 + " Q " + x1 + " " + y0 + " " + x1 + " " + (y0+r) +
      " L " + x1 + " " + (y1-r) + " Q " + x1 + " " + y1 + " " + (x1-r) + " " + y1 +
      " L " + (x0+r) + " " + y1 + " Q " + x0 + " " + y1 + " " + x0 + " " + (y1-r) +
      " L " + x0 + " " + (y0+r) + " Q " + x0 + " " + y0 + " " + (x0+r) + " " + y0 + " Z";
    const railW = 15 * scale / 0.42;

    /* A little platform on the two long straights, sitting just outside the
       rail the way a real platform hugs the track, so Henry can pull the
       train up alongside one and stop it there. Purely a place to park at --
       there's no snap-to-platform logic, just the scenery. The loop is a
       phone-shaped rounded rect, so which pair of straights is long enough
       to hold a platform depends on whether the screen is portrait or
       landscape -- pick whichever pair actually has room. */
    const platH = Math.max(14, 22 * scale / 0.42);
    const platMargin = Math.max(16, r * 0.28);
    const platGap = 5 + railW / 2;
    const stripe = Math.min(7, platH * 0.32);
    const hazardDefs = '<defs><pattern id="hazard" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">' +
      '<rect width="14" height="14" fill="#FFD23F"/><rect width="7" height="14" fill="#241A2E"/></pattern></defs>';
    // A band's own rect plus its rail-hugging stripe and two lamps, along
    // whichever axis it lies on: `along` is [start,end] on the axis the
    // platform runs, `near`/`far` are the cross-axis edges (near = the one
    // touching the rail, where the stripe goes); `axis` says which is x.
    function band(alongAxisIsX, alongStart, alongEnd, near, far){
      const alongLo = Math.min(alongStart, alongEnd), alongLen = Math.abs(alongEnd - alongStart);
      const crossLo = Math.min(near, far), crossLen = Math.abs(far - near);
      const stripeCross = near > far ? (near - stripe) : near;
      const lampAlong = [alongLo + alongLen*0.22, alongLo + alongLen*0.78];
      const lampCross = (near + far) / 2;
      const rectAt = function(cLo, cLen){
        return alongAxisIsX
          ? { x:alongLo, y:cLo, w:alongLen, h:cLen }
          : { x:cLo, y:alongLo, w:cLen, h:alongLen };
      };
      const slab = rectAt(crossLo, crossLen), edge = rectAt(stripeCross, stripe);
      let svg = '<rect x="'+slab.x+'" y="'+slab.y+'" width="'+slab.w+'" height="'+slab.h+'" rx="4" fill="#E4D9C2" stroke="#241A2E" stroke-width="3"/>' +
        '<rect x="'+edge.x+'" y="'+edge.y+'" width="'+edge.w+'" height="'+edge.h+'" fill="url(#hazard)"/>';
      lampAlong.forEach(function(la){
        const cx = alongAxisIsX ? la : lampCross, cy = alongAxisIsX ? lampCross : la;
        svg += '<circle cx="'+cx+'" cy="'+cy+'" r="4.5" fill="#FFD23F" stroke="#241A2E" stroke-width="2.5"/>';
      });
      return svg;
    }
    // Platforms are sized to the actual train, not the whole straight --
    // just long enough to pull the whole consist up alongside one.
    let trainLen = 0;
    if(vehicles.length){
      const tail = vehicles[vehicles.length - 1];
      trainLen = (tail.offsetPx + tail.v.w/2 + vehicles[0].v.w/2) * scale;
    }
    const hLen = (x1 - x0) - 2*r, vLen = (y1 - y0) - 2*r;
    let platformSvg = "";
    if(hLen >= vLen){
      const avail0 = x0 + r + platMargin, avail1 = x1 - r - platMargin;
      const platLen = Math.min(avail1 - avail0, trainLen || (avail1 - avail0));
      const mid = (avail0 + avail1) / 2;
      const p0 = mid - platLen/2, p1 = mid + platLen/2;
      const topEdge = y0 - platGap, topFar = topEdge - platH;
      const botEdge = y1 + platGap, botFar = botEdge + platH;
      if(p1 - p0 > 46 && topFar > 2 && botFar < h - 2){
        platformSvg = hazardDefs + band(true, p0, p1, topEdge, topFar) + band(true, p0, p1, botEdge, botFar);
      }
    } else {
      const avail0 = y0 + r + platMargin, avail1 = y1 - r - platMargin;
      const platLen = Math.min(avail1 - avail0, trainLen || (avail1 - avail0));
      const mid = (avail0 + avail1) / 2;
      const p0 = mid - platLen/2, p1 = mid + platLen/2;
      const leftEdge = x0 - platGap, leftFar = leftEdge - platH;
      const rightEdge = x1 + platGap, rightFar = rightEdge + platH;
      if(p1 - p0 > 46 && leftFar > 2 && rightFar < w - 2){
        platformSvg = hazardDefs + band(false, p0, p1, leftEdge, leftFar) + band(false, p0, p1, rightEdge, rightFar);
      }
    }

    trackSvg.setAttribute("viewBox", "0 0 " + w + " " + h);
    trackSvg.innerHTML = platformSvg +
      '<path d="' + d + '" fill="none" stroke="#241A2E" stroke-width="' + railW + '" stroke-linecap="round"/>' +
      '<path id="rail" d="' + d + '" fill="none" stroke="#FFF3D6" stroke-width="3.5" stroke-dasharray="11 11"/>';
    pathEl = trackSvg.querySelector("#rail");
    pathLen = pathEl.getTotalLength();
    buildPathSamples();

    /* Size the console from the loop's own inner rectangle, minus the rail
       stroke and a margin, so it always sits fully inside the track instead
       of spilling over the rails at the sides. */
    const innerW = (x1 - x0) - railW - 20;
    const innerH = (y1 - y0) - railW - 20;
    controlCard.style.width = Math.max(140, Math.min(innerW, 300)) + "px";
    controlCard.style.maxHeight = Math.max(170, innerH) + "px";
    // The rotated range input's length has to be driven from the measured
    // height, since a rotated element can't inherit its parent's extent.
    requestAnimationFrame(function(){
      const wrap = controlCard.querySelector(".throttleWrap");
      if(wrap && wrap.clientHeight > 20){
        wrap.style.setProperty("--tlen", Math.max(120, wrap.clientHeight - 8) + "px");
      }
    });

    place();
  }

  /* getPointAtLength is expensive enough that calling it a dozen times a
     frame pegged the main thread. Sample the loop once per layout and
     interpolate between the samples instead -- at this density the error is
     well under a pixel. */
  const PATH_SAMPLES = 720;
  let samples = null;
  function buildPathSamples(){
    samples = new Float32Array((PATH_SAMPLES + 1) * 2);
    for(let i = 0; i <= PATH_SAMPLES; i++){
      const pt = pathEl.getPointAtLength(pathLen * i / PATH_SAMPLES);
      samples[i*2] = pt.x;
      samples[i*2+1] = pt.y;
    }
  }
  const _pt = {x:0, y:0};
  function at(len){
    const L = ((len % pathLen) + pathLen) % pathLen;
    const f = L / pathLen * PATH_SAMPLES;
    const i = f | 0;
    const frac = f - i;
    const ax = samples[i*2], ay = samples[i*2+1];
    const bx = samples[i*2+2], by = samples[i*2+3];
    _pt.x = ax + (bx - ax) * frac;
    _pt.y = ay + (by - ay) * frac;
    return _pt;
  }

  function placeOne(veh, lenAt){
    const v = veh.v;
    const a = at(lenAt + (v.axleA - v.w/2) * scale);
    const ax = a.x, ay = a.y;                       // copy: at() reuses one object
    const b = at(lenAt + (v.axleB - v.w/2) * scale);
    const deg = Math.atan2(b.y - ay, b.x - ax) * 180 / Math.PI;
    const mx = (v.axleA + v.axleB) / 2;
    veh.el.style.transform =
      "translate(" + ((ax + b.x)/2) + "px," + ((ay + b.y)/2) + "px) " +
      "rotate(" + deg + "deg) scale(" + scale + ") " +
      "translate(" + (-mx) + "px," + (-RAIL_Y) + "px)";
  }

  function place(){
    if(!pathEl) return;
    vehicles.forEach(function(veh){
      placeOne(veh, (headLen - veh.offsetPx * scale + pathLen * 4) % pathLen);
    });
  }

  function setWheelSpeed(){
    const dur = trainDirection === 0 ? "0.9s" : (1.1 - (trainSpeed / 100) * 0.75) + "s";
    const dir = trainDirection < 0 ? "reverse" : "normal";
    document.querySelectorAll("#trainStage .wspin").forEach(function(w){
      w.style.animationDuration = dur;
      w.style.animationDirection = dir;
    });
  }

  function trainStep(ts){
    if(!pathEl){ trainRafId = requestAnimationFrame(trainStep); return; }
    if(trainLastTs == null) trainLastTs = ts;
    const dt = Math.min(0.05, (ts - trainLastTs) / 1000);
    trainLastTs = ts;
    if(trainDirection !== 0){
      headLen = (headLen + trainDirection * SPEED_PX * (trainSpeed/100) * dt + pathLen * 4) % pathLen;
      place();
      chuffAccum += dt;
      const chuffEvery = 0.55 - (trainSpeed / 100) * 0.4;
      if(chuffAccum >= chuffEvery){
        chuffAccum = 0;
        noise(.08, 0, 500);
        tone({f:90, dur:.08, type:"sine", vol:.15});
        const stack = vehicles[0].el.querySelector(".l-stack-flare");
        if(stack && !reduced){
          const r = stack.getBoundingClientRect();
          const size = (9 + Math.random()*7) * scale * 2;
          const puffEl = document.createElement("div");
          puffEl.className = "puff";
          const sr = trainStage.getBoundingClientRect();
          puffEl.style.cssText = "width:"+size+"px;height:"+size+"px;left:"+(r.left+r.width/2-sr.left-size/2)+"px;top:"+(r.top+r.height/2-sr.top-size/2)+"px;opacity:.75";
          trainStage.appendChild(puffEl);
          puffEl.animate([
            {transform:"translate(0,0) scale(.6)", opacity:.7},
            {transform:"translate("+(Math.random()*16-8)+"px,"+(-26-Math.random()*18)+"px) scale(1.7)", opacity:0}
          ], {duration:1200+Math.random()*500, easing:"ease-out"}).onfinish = function(){ puffEl.remove(); };
        }
      }
    }
    trainRafId = requestAnimationFrame(trainStep);
  }
  function startTrainLoop(){
    if(trainRafId != null) return;
    trainLastTs = null;
    trainRafId = requestAnimationFrame(trainStep);
  }
  function stopTrainLoop(){
    if(trainRafId != null){ cancelAnimationFrame(trainRafId); trainRafId = null; }
  }
  function setTrainDirection(dir){
    trainDirection = dir;
    const running = dir !== 0;
    trainStage.classList.toggle("running", running);
    // Light the button that matches what the train is actually doing, the
    // way a real console shows its selected notch.
    $("#btnFwd").classList.toggle("lit", dir === 1);
    $("#btnStop").classList.toggle("lit", dir === 0);
    $("#btnBack").classList.toggle("lit", dir === -1);
    setWheelSpeed();
    if(dir !== 0) tone({f:340, to:520, dur:.18, type:"triangle", vol:.18});
  }
  onTap($("#btnFwd"), function(){ setTrainDirection(1); });
  onTap($("#btnStop"), function(){ setTrainDirection(0); tone({f:260, to:120, dur:.2, type:"square", vol:.2}); });
  onTap($("#btnBack"), function(){ setTrainDirection(-1); });
  let hornLitTimer = null;
  onTap($("#btnWhistle"), function(){
    const hb = $("#btnWhistle");
    hb.classList.add("lit");
    clearTimeout(hornLitTimer);
    hornLitTimer = setTimeout(function(){ hb.classList.remove("lit"); }, 1200);
    tone({f:349, dur:.6, type:"sawtooth", vol:.22});
    tone({f:415, dur:.6, type:"sawtooth", vol:.18});
    tone({f:349, at:.65, dur:.5, type:"sawtooth", vol:.22});
    tone({f:415, at:.65, dur:.5, type:"sawtooth", vol:.18});
    const stack = vehicles[0].el.querySelector(".l-stack-flare") || vehicles[0].el;
    const r = stack.getBoundingClientRect();
    burst(r.left + r.width/2, r.top, ["#fff","#e8e8e8","#cfcfcf"], 22);
  });
  const speedSlider = $("#speedSlider");
  trainSpeed = parseInt(speedSlider.value, 10);
  speedSlider.addEventListener("input", function(){
    trainSpeed = parseInt(speedSlider.value, 10);
    setWheelSpeed();
  });

  // Tapping the train itself swaps to the next one -- no separate button.
  function cycleTrain(){
    trainSetIdx = (trainSetIdx + 1) % TRAIN_ORDER.length;
    const key = TRAIN_ORDER[trainSetIdx];
    buildTrain(key);
    layoutTrack(); // platform length tracks this train's actual length
    tone({f:520, to:780, dur:.2, type:"triangle", vol:.2});
    say(TRAIN_SETS[key].label[lang] || TRAIN_SETS[key].label.en);
  }
  buildTrain(TRAIN_ORDER[trainSetIdx]);
  setTrainDirection(0); // start with STOP lit, so the console reads its state

  /* ---------------- station announcements ----------------
     Spoken in German whatever the app language is -- these are the real
     phrases you hear on a German platform, which is the whole point. */
  const ANNOUNCEMENTS = {
    open:  { de:"Vorsicht, die Türen öffnen sich!",
             en:"Doors opening. Please stand clear." },
    close: { de:"Zurückbleiben bitte! Die Türen schließen.",
             en:"Stand back please! The doors are closing." },
    board: { de:"Einsteigen bitte!",
             en:"All aboard!" },
    exit:  { de:"Endstation! Bitte alle aussteigen.",
             en:"Final stop! All passengers please leave the train." },
    greet: { de:"Sehr geehrte Fahrgäste, willkommen an Bord.",
             en:"Dear passengers, welcome aboard." }
  };
  function stationChime(){
    // The familiar rising platform gong before an announcement.
    [{f:659,at:0},{f:880,at:.18},{f:1109,at:.36}].forEach(function(n){
      tone({f:n.f, at:n.at, dur:.5, type:"sine", vol:.16});
      tone({f:n.f*2, at:n.at, dur:.32, type:"sine", vol:.05});
    });
  }
  function sayAnnouncement(text, langCode, onDone){
    if(!("speechSynthesis" in window)) return;
    try{
      if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode === "de" ? "de-DE" : "en-US";
      const v = pickVoice(langCode);
      if(v) u.voice = v;
      u.rate = 1; u.pitch = 1; u.volume = 1;
      u.onstart = function(){ clearTimeout(duckRestoreTimer); duckTo(DUCK_LEVEL); };
      const undock = function(){
        clearTimeout(duckRestoreTimer);
        duckRestoreTimer = setTimeout(function(){ duckTo(OUT_LEVEL); }, 120);
        if(onDone) onDone();
      };
      u.onend = undock; u.onerror = undock;
      speechSynthesis.speak(u);
      clearTimeout(duckRestoreTimer);
      duckRestoreTimer = setTimeout(function(){ duckTo(OUT_LEVEL); }, 6000);
    }catch(e){}
  }
  let annLitTimer = null;
  document.querySelectorAll("[data-ann]").forEach(function(btn){
    onTap(btn, function(){
      const a = ANNOUNCEMENTS[btn.dataset.ann];
      if(!a) return;
      document.querySelectorAll("[data-ann]").forEach(function(o){ o.classList.remove("lit"); });
      btn.classList.add("lit");
      clearTimeout(annLitTimer);
      annLitTimer = setTimeout(function(){ btn.classList.remove("lit"); }, 4200);
      stationChime();
      setTimeout(function(){ sayAnnouncement(a[lang] || a.en, lang, function(){
        clearTimeout(annLitTimer);
        btn.classList.remove("lit");
      }); }, 620);
      const p = centerOf(btn);
      burst(p.x, p.y, ["#FFD23F","#fff","#8FC2E8"], 12);
    });
  });

  window.addEventListener("resize", function(){
    if($("#train").classList.contains("on")) layoutTrack();
    if($("#lift").classList.contains("on")) layoutLift();
    if($("#draw").classList.contains("on")) fitCanvas();
  });

  /* ---------------- ELEVATOR ----------------
     A side-on cutaway of a station. Three levels stacked up the screen, a
     shaft down the left, trains sliding in along the right. People get off
     the trains, walk to the lift and wait there holding up the number of
     the floor they want; the number pops off the moment you deliver them.

     Scenery is drawn in art units and scaled by --k (set from the measured
     floor height), the way the train screen scales its rolling stock.
     Actors are positioned in real pixels by this loop and scaled by the
     same factor, so one drawing serves every screen size. */
  const liftStage = $("#liftStage"), liftShaft = $("#liftShaft"), liftCar = $("#liftCar"),
        liftPeds = $("#liftPeds"), liftTrainLayer = $("#liftTrains"), liftCable = $("#liftCable"),
        liftDot = $("#liftDot"), liftUp = $("#liftUp"), liftDn = $("#liftDn"), pipRow = $("#pipRow");
  const FLOOR_COLOR_VAR = ["--f1", "--f2", "--f3"];
  const FLOOR_COLOR_KEY = ["yellow", "red", "blue"];
  const FLOOR_LETTER = ["U", "S", "H"];

  const PED_W = 22, PED_H = 44, SLAB = 11, TRAIN_W = 116, TRAIN_H = 52;
  const CAR_CAP = 3, MAX_PEOPLE = 8, PIPS = 5;
  const SHIRTS = ["#22CFE0","#EF3E36","#8DC63F","#7A3FBF","#FF4FA3","#FFD23F","#F57D0D","#FFF3D6"];
  const SKINS  = ["#E8B98A","#C98B5E","#8D5A3B","#F0D0B0"];

  let LK = 1, LW = 0, LH = 0, shaftW = 76, floorH = 0, carW = 0, carH = 0;
  const groundY = [0, 0, 0];             // real px of each floor's ground line
  let carFloor = 0, carY = 0, carFrom = 0, carTo = 0, carT = 0, carDur = 1;
  let carMoving = false, carGoingTo = 0, shownFloor = 0;
  let people = [], riders = [], trainList = [];
  let streetTimer = 5, motorAcc = 0, delivered = 0;
  let liftRaf = null, liftLastTs = null, liftReady = false, liftSeeded = false;

  function ease(t){ return t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2; }
  function queueX(i){ return shaftW + (9 + i * 25) * LK; }
  function slotX(i){ return 3 + i * (PED_W * LK + 4); }
  function stopX(){ return LW - (8 + TRAIN_W) * LK; }
  function awayX(){ return LW + 26 * LK; }

  function layoutLift(){
    LW = liftStage.clientWidth; LH = liftStage.clientHeight;
    if(LW < 60 || LH < 60) return;
    floorH = LH / 3;
    LK = Math.max(0.40, Math.min(1.25, floorH / 145));
    shaftW = Math.round(Math.max(46, Math.min(112, LW * 0.24)));
    liftShaft.style.width = shaftW + "px";
    liftStage.style.setProperty("--k", LK);
    liftStage.style.setProperty("--artw", Math.round((LW - shaftW) / LK));
    for(let i = 0; i < 3; i++) groundY[i] = LH - i * floorH - SLAB * LK;
    carW = Math.max(24, shaftW - 12);
    carH = Math.min(floorH - 10, 118 * LK);
    liftCar.style.width = carW + "px";
    liftCar.style.height = carH + "px";
    liftCar.style.left = Math.round((shaftW - carW) / 2 - 2) + "px";
    liftCar.querySelector(".cfloor").style.height = Math.max(3, 7 * LK) + "px";
    if(!carMoving) carY = groundY[carFloor] - carH;
    setDot(shownFloor);
    liftReady = true;
    buildTrains();
    riders.forEach(function(p, i){ p.slot = i; p.x = slotX(i); });
    people.forEach(placePed);
    positionTrains();
    applyCar();
    if(!liftSeeded){
      liftSeeded = true;
      spawnPed(0, 2, stopX() + 40 * LK);
      spawnPed(1, 0, stopX() + 70 * LK);
    }
  }

  function applyCar(){
    liftCar.style.transform = "translateY(" + carY + "px)";
    liftCable.style.height = Math.max(0, carY) + "px";
  }

  function setArrows(){
    const up = carMoving && carTo < carFrom, dn = carMoving && carTo > carFrom;
    liftUp.classList.toggle("on", up);
    liftDn.classList.toggle("on", dn);
  }
  // The readout is a plain color dot instead of a floor digit -- same color
  // language as the room itself, the sign, and the badges people hold up.
  function setDot(i){
    liftDot.style.color = "var(" + FLOOR_COLOR_VAR[i] + ")";
    liftDot.style.background = "var(" + FLOOR_COLOR_VAR[i] + ")";
  }

  /* ---- people ---- */
  function pedHtml(dest){
    return '<i class="badge bg' + (dest + 1) + '">' + FLOOR_LETTER[dest] + '</i>' +
      '<i class="head"></i><i class="torso"></i><i class="arm a"></i><i class="arm b"></i>' +
      '<i class="leg a"></i><i class="leg b"></i>';
  }
  function otherFloor(f){
    const opts = [0, 1, 2].filter(function(i){ return i !== f; });
    return opts[(Math.random() * opts.length) | 0];
  }
  function spawnPed(floor, dest, x){
    if(people.length >= MAX_PEOPLE) return null;
    const el = document.createElement("div");
    el.className = "ped walk";
    el.style.setProperty("--shirt", SHIRTS[(Math.random() * SHIRTS.length) | 0]);
    el.style.setProperty("--skin", SKINS[(Math.random() * SKINS.length) | 0]);
    el.innerHTML = pedHtml(dest);
    liftPeds.appendChild(el);
    const p = { el: el, floor: floor, dest: dest, x: x, tx: x, state: "toLift",
                inCar: false, slot: 0, dead: false, spd: 0.9 + Math.random() * 0.3 };
    people.push(p);
    onTap(el, function(e){
      e.stopPropagation(); // don't also trigger the floor they're standing on
      say(t().colorNames[FLOOR_COLOR_KEY[p.dest]]);
      const c = centerOf(el); burst(c.x, c.y, ["#fff", "#FFD23F"], 8);
    });
    requeue(floor);
    placePed(p);
    return p;
  }
  function placePed(p){
    const y = p.inCar ? (carH - Math.max(3, 7 * LK) - PED_H * LK) : (groundY[p.floor] - PED_H * LK);
    p.el.style.transform = "translate(" + p.x + "px," + y + "px) scale(" + LK + ")";
  }
  function requeue(f){
    let i = 0;
    people.forEach(function(p){
      if(p.floor === f && !p.inCar && (p.state === "toLift" || p.state === "wait")){
        p.tx = queueX(i++);
        if(p.state === "wait" && Math.abs(p.x - p.tx) > 1.5) p.state = "toLift";
      }
    });
  }
  function boarding(){
    return people.some(function(p){ return p.state === "board" || p.state === "off"; });
  }

  function intoCar(p){
    liftCar.insertBefore(p.el, liftCar.querySelector(".leaf.l"));
    p.inCar = true; p.state = "ride";
    riders.push(p);
    p.slot = riders.length - 1;
    p.x = slotX(p.slot);
    placePed(p);
    requeue(carFloor);
    tone({ f: 520, dur: .08, type: "sine", vol: .12 });
  }
  function startUnload(p){
    p.state = "off";
    riders = riders.filter(function(r){ return r !== p; });
    riders.forEach(function(r, i){ r.slot = i; r.x = slotX(i); placePed(r); });
    liftPeds.appendChild(p.el);
    p.inCar = false; p.floor = carFloor;
    p.x = shaftW * 0.4;
    const b = p.el.querySelector(".badge");
    if(b) b.remove();
    const poof = document.createElement("i");
    poof.className = "poof";
    poof.innerHTML = "<i></i><i></i><i></i>";
    p.el.appendChild(poof);
    setTimeout(function(){ if(poof.parentNode) poof.remove(); }, 520);
    const th = document.createElement("i");
    th.className = "thanks";
    th.textContent = t().liftThanks;
    p.el.appendChild(th);
    setTimeout(function(){ if(th.parentNode) th.remove(); }, 1700);
    tone({ f: 880, to: 1320, dur: .2, type: "triangle", vol: .18 });
    const c = centerOf(p.el);
    burst(c.x, c.y, ["#FFD23F", "#fff", "#8DC63F"], 12);
    p.tx = LW + (30 + Math.random() * 40) * LK;
    p.state = "leave";
    addPip();
  }
  function addPip(){
    delivered++;
    const pips = pipRow.children;
    for(let i = 0; i < pips.length; i++) pips[i].classList.toggle("on", i < ((delivered - 1) % PIPS) + 1);
    if(delivered % PIPS === 0){
      const r = liftStage.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 3, PALETTE, 26);
      stationChime();
      setTimeout(function(){
        for(let i = 0; i < pips.length; i++) pips[i].classList.remove("on");
      }, 900);
    }
  }

  /* ---- trains ---- */
  function buildTrains(){
    if(trainList.length) return;
    // f: 0 = U-Bahn, 1 = S-Bahn, 2 = the bus at the Haltestelle. All three
    // share the same travel rig (stopX/awayX, ease-in/out, ground line) --
    // only the art differs.
    for(let f = 0; f < 3; f++){
      const el = document.createElement("div");
      const isBus = f === 2;
      el.className = "ltrain " + (isBus ? "bus" : (f === 0 ? "u" : "s"));
      el.innerHTML = isBus
        ? '<div class="tlamp"></div><div class="tbody"></div>' +
          '<div class="twin w1"></div><div class="twin w2"></div><div class="twin w3"></div>' +
          '<div class="tdoor d1"></div>' +
          '<i class="tw k1"></i><i class="tw k2"></i>'
        : '<div class="tnose"></div><div class="tlamp"></div><div class="tbody"></div>' +
          (f === 1 ? '<div class="ttop"></div>' : "") +
          '<div class="twin w1"></div><div class="twin w2"></div><div class="twin w3"></div>' +
          '<div class="tdoor d1"></div><div class="tdoor d2"></div>' +
          '<i class="tw k1"></i><i class="tw k2"></i><i class="tw k3"></i><i class="tw k4"></i>';
      liftTrainLayer.appendChild(el);
      const tr = { el: el, f: f, state: "away", t: 2.5 + f * 2.5, x: 0, p: 0 };
      onTap(el, function(e){
        e.stopPropagation();
        if(isBus){
          tone({ f: 220, dur: .4, type: "square", vol: .18 });
        } else {
          tone({ f: 330, dur: .5, type: "sawtooth", vol: .2 });
          tone({ f: 392, dur: .5, type: "sawtooth", vol: .16 });
        }
      });
      trainList.push(tr);
    }
  }
  function positionTrains(){
    trainList.forEach(function(tr){
      if(tr.state === "away") tr.x = awayX();
      else if(tr.state === "stop") tr.x = stopX();
      tr.el.style.transform = "translate(" + tr.x + "px," + (groundY[tr.f] - (TRAIN_H + 3) * LK) + "px) scale(" + LK + ")";
    });
  }
  function stepTrains(dt){
    trainList.forEach(function(tr){
      tr.t -= dt;
      if(tr.state === "away"){
        if(tr.t <= 0){ tr.state = "in"; tr.p = 0; noise(.9, 0, 320, .14); }
      } else if(tr.state === "in"){
        tr.p = Math.min(1, tr.p + dt / 1.5);
        tr.x = awayX() + (stopX() - awayX()) * ease(tr.p);
        if(tr.p >= 1){
          tr.state = "stop"; tr.t = 6.5;
          tr.el.classList.add("open");
          noise(.4, 0, 900, .12);
          const n = 1 + ((Math.random() * 2) | 0);
          for(let i = 0; i < n; i++){
            spawnPed(tr.f, otherFloor(tr.f), stopX() + (24 + i * 30 + Math.random() * 14) * LK);
          }
        }
      } else if(tr.state === "stop"){
        if(tr.t <= 0){ tr.state = "out"; tr.p = 0; tr.el.classList.remove("open"); noise(.4, 0, 900, .12); }
      } else if(tr.state === "out"){
        tr.p = Math.min(1, tr.p + dt / 1.5);
        tr.x = stopX() + (awayX() - stopX()) * ease(tr.p);
        if(tr.p >= 1){ tr.state = "away"; tr.t = 7 + Math.random() * 6; }
      }
      tr.el.style.transform = "translate(" + tr.x + "px," + (groundY[tr.f] - (TRAIN_H + 3) * LK) + "px) scale(" + LK + ")";
    });
  }

  /* ---- the ride ----
     No doors to open or close: the leaves are glass, always see-through, so
     there was never a reason to make the car wait on them. A floor tap
     retargets the car immediately, whether it's parked or already mid-ride
     -- carFrom is always the car's live position, so redirecting mid-flight
     just bends the trip toward the new floor instead of finishing the old
     one first. */
  function startTravel(i){
    if(i === carGoingTo && carMoving) return;
    // Anyone still walking toward the door doesn't get to board a car
    // that's about to leave -- send them back to the queue.
    people.forEach(function(p){
      if(p.state === "board"){ p.state = "wait"; }
    });
    requeue(carFloor);
    carGoingTo = i;
    carFrom = carY;
    carTo = groundY[i] - carH;
    const perFloor = Math.max(1, floorH) / 0.85; // px/sec, matches the old one-floor pace
    carDur = Math.max(0.35, Math.abs(carTo - carFrom) / perFloor);
    carT = 0;
    carMoving = true;
    setArrows();
  }
  function stepCar(dt){
    if(!carMoving) return;
    carT += dt;
    const tt = Math.min(1, carT / carDur);
    carY = carFrom + (carTo - carFrom) * ease(tt);
    const bottom = carY + carH;
    let near = 0, best = 1e9;
    for(let i = 0; i < 3; i++){
      const d = Math.abs(groundY[i] - bottom);
      if(d < best){ best = d; near = i; }
    }
    if(near !== shownFloor){
      shownFloor = near;
      setDot(near);
      tone({ f: 880, dur: .05, type: "sine", vol: .09 });
    }
    motorAcc += dt;
    if(motorAcc > 0.3){ motorAcc = 0; noise(.09, 0, 420, .08); }
    applyCar();
    if(tt >= 1){
      carMoving = false;
      carFloor = carGoingTo;
      shownFloor = carFloor;
      setDot(carFloor);
      setArrows();
      tone({ f: 1046, dur: .45, type: "sine", vol: .2 });
      tone({ f: 784, at: .22, dur: .55, type: "sine", vol: .18 });
      say(t().liftSay[carFloor]);
    }
  }

  /* ---- who gets on and off ----
     The car services its current floor continuously while parked -- no
     door-open window to squeeze into, people just walk on and off. */
  function service(){
    if(carMoving || boarding()) return;
    const out = riders.find(function(r){ return r.dest === carFloor; });
    if(out){ startUnload(out); return; }
    if(riders.length < CAR_CAP){
      let next = null;
      people.forEach(function(p){
        if(p.inCar || p.floor !== carFloor) return;
        if(p.state !== "wait" && p.state !== "toLift") return;
        if(!next || p.tx < next.tx) next = p;
      });
      if(next && next.state === "wait"){
        next.state = "board";
        next.tx = shaftW / 2 - PED_W * LK / 2;
      }
    }
  }

  function stepPeople(dt){
    const pace = Math.max(42 * LK, (LW - shaftW) * 0.13);
    people.forEach(function(p){
      if(p.state === "toLift" || p.state === "leave" || p.state === "board"){
        const d = p.tx - p.x, step = pace * p.spd * dt;
        if(Math.abs(d) <= step){
          p.x = p.tx;
          if(p.state === "toLift"){ p.state = "wait"; }
          else if(p.state === "board"){ intoCar(p); }
          else { p.dead = true; p.el.remove(); }
        } else {
          p.x += (d > 0 ? 1 : -1) * step;
        }
        p.el.classList.add("walk");
      } else {
        p.el.classList.remove("walk");
      }
      if(!p.dead) placePed(p);
    });
    people = people.filter(function(p){ return !p.dead; });
  }

  function stepSpawns(dt){
    streetTimer -= dt;
    if(streetTimer <= 0){
      streetTimer = 9 + Math.random() * 7;
      spawnPed(2, (Math.random() < .5 ? 0 : 1), LW - 44 * LK);
    }
  }

  function liftStep(ts){
    liftRaf = requestAnimationFrame(liftStep);
    if(!liftReady) return;
    if(liftLastTs == null) liftLastTs = ts;
    const dt = Math.min(0.05, (ts - liftLastTs) / 1000);
    liftLastTs = ts;
    stepCar(dt);
    stepTrains(dt);
    stepPeople(dt);
    stepSpawns(dt);
    service();
  }
  function startLiftLoop(){
    if(liftRaf != null) return;
    liftLastTs = null;
    liftRaf = requestAnimationFrame(liftStep);
  }
  function stopLiftLoop(){
    if(liftRaf != null){ cancelAnimationFrame(liftRaf); liftRaf = null; }
  }

  /* ---- calling the car: tap the floor itself ---- */
  document.querySelectorAll(".lroom").forEach(function(room){
    const i = parseInt(room.dataset.floor, 10);
    onTap(room, function(){
      room.classList.remove("tapped"); void room.offsetWidth; room.classList.add("tapped");
      if(i === carFloor && !carMoving){
        tone({ f: 660, dur: .09, type: "square", vol: .12 });
        return;
      }
      tone({ f: 660, dur: .09, type: "square", vol: .18 });
      startTravel(i);
    });
  });

  /* ---------------- PARENT MODE ---------------- */
  const parentLock = $("#parentLock"), parentModal = $("#parentModal");
  const parentPie = $("#parentPie"), parentFade = $("#parentFade");
  const chipRow = $("#chipRow"), parentStart = $("#parentStart"), parentStop = $("#parentStop");
  const FADE_MS = 10000; // last 10 seconds fade to black
  let selectedMin = null, sessionEndAt = null, sessionTotalMs = 0, parentTickId = null;

  function openParentModal(){
    parentModal.classList.add("on");
    parentStop.classList.toggle("show", sessionEndAt != null);
    tone({f:520, to:700, dur:.18, type:"sine", vol:.18});
  }
  function closeParentModal(){ parentModal.classList.remove("on"); }
  onTap($("#parentClose"), closeParentModal);
  document.addEventListener("pointerdown", function(e){
    if(e.target === parentModal) closeParentModal();
  });

  chipRow.querySelectorAll(".chip").forEach(function(chip){
    onTap(chip, function(){
      selectedMin = parseInt(chip.dataset.min, 10);
      chipRow.querySelectorAll(".chip").forEach(c => c.classList.toggle("selected", c === chip));
      tone({f:440, dur:.1, type:"sine", vol:.15});
    });
  });

  function endParentSession(){
    if(parentTickId != null){ clearInterval(parentTickId); parentTickId = null; }
    sessionEndAt = null;
    parentPie.classList.remove("show");
    parentFade.style.opacity = "0";
  }
  function tickParentSession(){
    if(sessionEndAt == null) return;
    const remaining = sessionEndAt - Date.now();
    if(remaining <= 0){
      parentFade.style.opacity = "1";
      // Time's up: quiet everything down, but stay locked -- a parent has
      // to hold the lock icon again to open the modal and resume play.
      if(typeof stopDrawTone === "function") stopDrawTone();
      if(typeof stopTrainLoop === "function") stopTrainLoop();
      if(typeof stopLiftLoop === "function") stopLiftLoop();
      if("speechSynthesis" in window) speechSynthesis.cancel();
      if(parentTickId != null){ clearInterval(parentTickId); parentTickId = null; }
      sessionEndAt = null;
      parentPie.classList.remove("show");
      return;
    }
    const frac = Math.max(0, Math.min(1, remaining / sessionTotalMs));
    parentPie.style.background =
      "conic-gradient(var(--slime) 0% " + (frac*100) + "%, rgba(255,255,255,.4) " + (frac*100) + "% 100%)";
    parentFade.style.opacity = String(Math.max(0, Math.min(1, (FADE_MS - remaining) / FADE_MS)));
  }
  onTap(parentStart, function(){
    const minutes = selectedMin || 10;
    sessionTotalMs = minutes * 60000;
    sessionEndAt = Date.now() + sessionTotalMs;
    parentFade.style.opacity = "0";
    parentPie.classList.add("show");
    if(parentTickId != null) clearInterval(parentTickId);
    parentTickId = setInterval(tickParentSession, 250);
    tickParentSession();
    closeParentModal();
    tone({f:660, to:990, dur:.25, type:"triangle", vol:.2});
  });
  onTap(parentStop, function(){
    endParentSession();
    closeParentModal();
    tone({f:520, to:260, dur:.2, type:"square", vol:.18});
  });

  // Press-and-hold, not a plain tap, so a curious toddler mashing buttons
  // can't stumble into the parent controls by accident.
  let lockPressTimer = null;
  parentLock.addEventListener("pointerdown", function(e){
    e.preventDefault();
    clearTimeout(lockPressTimer);
    lockPressTimer = setTimeout(openParentModal, 900);
  }, {passive:false});
  ["pointerup","pointercancel","pointerleave"].forEach(function(evt){
    parentLock.addEventListener(evt, function(){ clearTimeout(lockPressTimer); });
  });

  /* ---------------- child's name ----------------
     The logo is the app's name, so renaming it lives right there: hold it
     down for ten seconds (long enough that a toddler bouncing on it won't
     trigger it by accident) and a modal offers to rename the whole arcade.
     Only the on-screen title and browser tab change -- the home-screen
     icon is a baked PWA asset and can't be renamed at runtime. */
  let childName = (localStorage.getItem("slimeName") || "Henry").trim().slice(0, 12) || "Henry";
  const logoBlob = $("#logoBlob"), logoH1 = $("#logoH1");
  const nameModal = $("#nameModal"), nameInput = $("#nameInput");
  function applyName(){
    logoH1.textContent = "";
    logoH1.appendChild(document.createTextNode(childName.toUpperCase() + "'S"));
    logoH1.appendChild(document.createElement("br"));
    logoH1.appendChild(document.createTextNode("ARCADE"));
    document.title = childName + "'s Arcade";
  }
  function setChildName(n){
    n = (n || "").trim().slice(0, 12);
    if(!n) return;
    childName = n;
    localStorage.setItem("slimeName", childName);
    applyName();
  }
  function openNameModal(){
    nameInput.value = childName;
    nameModal.classList.add("on");
    tone({f:520, to:700, dur:.18, type:"sine", vol:.18});
    setTimeout(function(){ nameInput.focus(); nameInput.select(); }, 50);
  }
  function closeNameModal(){ nameModal.classList.remove("on"); }
  onTap($("#nameClose"), closeNameModal);
  onTap($("#nameSave"), function(){
    setChildName(nameInput.value);
    closeNameModal();
    tone({f:660, to:990, dur:.25, type:"triangle", vol:.2});
  });
  document.addEventListener("pointerdown", function(e){
    if(e.target === nameModal) closeNameModal();
  });
  let logoPressTimer = null;
  logoBlob.addEventListener("pointerdown", function(e){
    e.preventDefault();
    clearTimeout(logoPressTimer);
    logoPressTimer = setTimeout(openNameModal, 10000);
  }, {passive:false});
  ["pointerup","pointercancel","pointerleave"].forEach(function(evt){
    logoBlob.addEventListener(evt, function(){ clearTimeout(logoPressTimer); });
  });

  /* ---------------- language ---------------- */
  function applyLang(){
    const d = t();
    document.documentElement.lang = lang;
    applyName();
    document.querySelectorAll("[data-nametitle]").forEach(el => el.textContent = d.nameTitle);
    document.querySelectorAll("[data-tagline]").forEach(el => el.textContent = d.tagline);
    document.querySelectorAll("[data-home]").forEach(el => el.textContent = d.home);
    document.querySelectorAll("[data-title]").forEach(el => el.textContent = d.titles[el.dataset.title]);
    document.querySelectorAll("[data-tile]").forEach(el => el.textContent = d.tiles[el.dataset.tile]);
    shapeWord.textContent = d.hints.shape;
    colorWord.textContent = d.hints.color;
    numWord.textContent = d.hints.number;
    soundWord.textContent = d.hints.sound;
    renderTypeBox();
    document.querySelectorAll("[data-clear]").forEach(el => el.textContent = d.clearLabel);
    document.querySelectorAll("[data-save]").forEach(el => el.textContent = d.saveLabel);
    document.querySelectorAll("[data-speak]").forEach(el => el.textContent = d.speakLabel);
    document.querySelectorAll("[data-space]").forEach(el => el.textContent = d.spaceLabel);
    document.querySelectorAll("[data-erase]").forEach(el => el.textContent = d.eraseLabel);
    document.querySelectorAll("[data-parent]").forEach(el => el.textContent = d.parent[el.dataset.parent]);
    document.querySelectorAll("[data-ctrl]").forEach(el => el.textContent = d.ctrl[el.dataset.ctrl]);
    document.querySelectorAll("[data-lname]").forEach(el => el.textContent = d.liftNames[parseInt(el.dataset.lname, 10) - 1]);
    shapeBtns.forEach(o => o.btn.setAttribute("aria-label", d.shapeNames[o.key]));
    colorBtns.forEach(o => o.btn.setAttribute("aria-label", d.colorNames[o.key]));
    document.querySelectorAll(".langSwitch button").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.lang === lang);
    });
  }
  function setLang(next){
    if(next !== "en" && next !== "de") return;
    lang = next;
    localStorage.setItem("slimeLang", lang);
    applyLang();
    tone({f:520, to:780, dur:.15, type:"triangle", vol:.2});
    say(t().langName[lang]);
  }
  // S-Bahn Chaos is a separate, self-contained script (its own IIFE,
  // its own huge inline SVG) rather than code merged into this one --
  // too large and too independent to safely share a scope with. This
  // is the only door between the two: the same pre-rendered-buffer
  // tone()/noise() this whole app already uses, not a second audio
  // engine.
  window.henryArcadeAudio = { tone: tone, noise: noise, say: say, stationChime: stationChime };

  applyLang();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("/sw.js").catch(function(){});
    });
  }
})();
</script>
<script>
function initSbahnChaos(){
  var HA = window.henryArcadeAudio || { tone:function(){}, noise:function(){}, say:function(){}, stationChime:function(){} };
  var svg = document.getElementById("svg1");
  var layer1 = document.getElementById("layer1");
  var layer3 = document.getElementById("layer3");
  var floor  = document.getElementById("path41");
  var PAGE_W = svg.viewBox.baseVal.width  || 210;
  var PAGE_H = svg.viewBox.baseVal.height || 297;

  function q(label) { return svg.querySelector('[inkscape\\:label="' + label + '"]'); }
  function id(v) { return document.getElementById(v); }
  function svgEl(n) { return document.createElementNS("http://www.w3.org/2000/svg", n); }

  function toUser(evt) {
    var pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function matIn(el, ref) {
    return (ref || svg).getScreenCTM().inverse().multiply(el.getScreenCTM());
  }
  function matStr(m) { return "matrix(" + [m.a, m.b, m.c, m.d, m.e, m.f].join(",") + ")"; }
  function boxIn(el, ref) {
    var b = el.getBBox(), m = matIn(el, ref), xs = [], ys = [];
    [[b.x, b.y], [b.x + b.width, b.y], [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]]
      .forEach(function (c) {
        var p = svg.createSVGPoint(); p.x = c[0]; p.y = c[1];
        p = p.matrixTransform(m); xs.push(p.x); ys.push(p.y);
      });
    return { x1: Math.min.apply(null, xs), x2: Math.max.apply(null, xs),
             y1: Math.min.apply(null, ys), y2: Math.max.apply(null, ys) };
  }
  function wrapEl(el, cls) {
    var g = svgEl("g");
    g.setAttribute("class", cls);
    el.parentNode.insertBefore(g, el);
    g.appendChild(el);
    return g;
  }

      }
      if (best < 0) {
        out.push(path[i]);
        cur = { x: path[i].x, y: path[i].y, level: path[i].level, lane: path[i].lane };
        i++;
      } else {
        out.push(path[best]);
        cur = bestEnd;
        i = best + 1;
      }
    }
    return out;
  }

  function gatesOf(h) {
    return { outTop: { x: h.cx, y: LANE_TOP - APPROACH },
             inTop:  { x: h.cx, y: LANE_TOP + APPROACH },
             inBot:  { x: h.cx, y: LANE_BOT - APPROACH },
             outBot: { x: h.cx, y: LANE_BOT + APPROACH } };
  }
  function wp(p, level, lane) { return { x: p.x, y: p.y, level: level, lane: lane }; }

  function levelOfPoint(px, py) {
    if (py >= LANE_BOT) return { level: "ubahn", half: null };
    var L = laneAt(px);
    if (L && ((py > LANE_TOP && py <= SIDEWALK_TOP) || (py >= SIDEWALK_BOT && py < LANE_BOT))) {
      return { level: "shaft", half: px <= L.down.x2 ? L.down : L.up };
    }
    return { level: "surface", half: null };
  }
  function segTo(from, pt, lock) {
    var path = plan(from, pt.x, pt.y, lock);
    if (!path) return null;
    if (walkable(pt.x, pt.y)) path.push(wp(pt, lock, null));
    if (!path.length) return null;
    return smooth(from, path);
  }
  function pathLen(from, path) {
    var t = 0, px = from.x, py = from.y;
    for (var i = 0; i < path.length; i++) {
      t += Math.hypot(path[i].x - px, path[i].y - py);
      px = path[i].x; py = path[i].y;
    }
    return t;
  }

  function buildRoute(me, tx, ty) {
    var out = [], st = { x: me.x, y: me.y, level: me.level, lane: me.lane };
    var tgt = levelOfPoint(tx, ty);

    if (st.level === "shaft") {
      var h = st.lane, gt = gatesOf(h);
      if (tgt.level === "shaft" && tgt.half === h) return [wp({ x: h.cx, y: ty }, "shaft", h)];
      if (h.down) {
        out.push(wp(gt.inBot, "shaft", h), wp(gt.outBot, "ubahn", null));
        st = { x: gt.outBot.x, y: gt.outBot.y, level: "ubahn", lane: null };
      } else {
        out.push(wp(gt.inTop, "shaft", h), wp(gt.outTop, "surface", null));
        st = { x: gt.outTop.x, y: gt.outTop.y, level: "surface", lane: null };
      }
    }

    var need = tgt.level === "shaft" ? (tgt.half.down ? "surface" : "ubahn") : tgt.level;

    if (st.level !== need) {
      var descending = st.level === "surface";
      var best = null;
      for (var i = 0; i < LANES.length; i++) {
        var half = descending ? LANES[i].down : LANES[i].up;
        var g = gatesOf(half);
        var lead = segTo(st, descending ? g.outTop : g.outBot, st.level);
        if (!lead) continue;
        var far = descending ? g.outBot : g.outTop;
        var cost = pathLen(st, lead) + (LANE_BOT - LANE_TOP) / half.speed +
                   Math.hypot(far.x - tx, far.y - ty);
        if (!best || cost < best.cost) best = { cost: cost, half: half, lead: lead, g: g };
      }
      if (!best) return null;
      out = out.concat(best.lead);
      if (descending) {
        out.push(wp(best.g.inTop, "shaft", best.half),
                 wp(best.g.inBot, "shaft", best.half),
                 wp(best.g.outBot, "ubahn", null));
        st = { x: best.g.outBot.x, y: best.g.outBot.y, level: "ubahn", lane: null };
      } else {
        out.push(wp(best.g.inBot, "shaft", best.half),
                 wp(best.g.inTop, "shaft", best.half),
                 wp(best.g.outTop, "surface", null));
        st = { x: best.g.outTop.x, y: best.g.outTop.y, level: "surface", lane: null };
      }
    }

    if (tgt.level === "shaft") {
      var th = tgt.half, tg = gatesOf(th);
      var lead2 = segTo(st, th.down ? tg.outTop : tg.outBot, st.level);
      if (!lead2) return null;
      return out.concat(lead2, [wp(th.down ? tg.inTop : tg.inBot, "shaft", th),
                                wp({ x: th.cx, y: ty }, "shaft", th)]);
    }
    var tail = segTo(st, { x: tx, y: ty }, tgt.level);
    if (!tail) return null;
    return out.concat(tail);
  }

  /* ================= actors ======================================================
     One movement system for everybody. The player gets clicks and keys, the
     others get an errand list.                                                  */

  var TURN = 0.22, BRAKE = 3;

  function makeActor(node, opts) {
    var walker = wrapEl(node, "walker");

    var cupEl = svgEl("path");                 // coffee, right hand
    cupEl.setAttribute("d", "m 176.9,199.6 h 3.1 l -0.45,4.3 h -2.2 z");
    cupEl.setAttribute("style", "fill:#f4f1e8;stroke:#1a1a1a;stroke-width:0.8;display:none");
    node.appendChild(cupEl);

    var tkEl = svgEl("rect");                  // ticket, left hand
    tkEl.setAttribute("x", 160.2); tkEl.setAttribute("y", 199.4);
    tkEl.setAttribute("width", 5.2); tkEl.setAttribute("height", 3.7);
    tkEl.setAttribute("style", "fill:#cccccc;stroke:#1a1a1a;stroke-width:0.8;display:none");
    node.appendChild(tkEl);
    var portal = wrapEl(walker, "portal");
    if (!opts.interactive) portal.style.pointerEvents = "none";

    var a = {
      x: opts.x, y: opts.y, level: "surface", lane: null,
      route: null, at: 0, goal: null, retries: 0,
      vel: { x: 0, y: 0 }, stallT: 0, waitT: 0, errands: [], job: opts.job || null
    };

    function doorAt(px, py) {
      for (var i = 0; i < DOORS.length; i++) {
        var d = DOORS[i], b = d.box;
        if (px < b.x1 || px > b.x2 || py < b.y1) continue;
        if (py <= baseAt(propByKey(d.prop), px) + 0.5) return d;
      }
      return null;
    }
    function slot() {
      var car = LIFTZONE.carDepth && LIFTZONE.carDepth(a.x, a.y);
      if (car) return { parent: car.parent, before: car.before, clip: null };
      var door = doorAt(a.x, a.y);
      if (door) return { parent: layer1, before: frontOf(door.prop), clip: door.clip };
      if (a.level === "shaft" && a.y > SIDEWALK_TOP) {
        return { parent: layer1, before: SIDEWALK, clip: null };
      }
      if (a.y < FLOOR_TOP) {
        var reach = (MID.yBase - a.y) * MID.slope;
        var train = null;
        if (a.x < MID.xL + reach)      train = TRAINS.red;
        else if (a.x > MID.xR - reach) train = TRAINS.blue;
        var behind = train && a.y <= train.baseY;
        return { parent: layer3, before: behind ? TRAINS.blue.wrap : SKY, clip: null };
      }
      for (var j = 0; j < props.length; j++) {
        if (baseAt(props[j], a.x) > a.y) return { parent: layer1, before: props[j].el, clip: null };
      }
      return { parent: layer1, before: null, clip: null };
    }

    var clipNow = null;
    a.apply = function () {
      var t = slot();
      if (portal.parentNode !== t.parent || portal.nextSibling !== t.before) {
        t.parent.insertBefore(portal, t.before);
      }
      if (t.clip !== clipNow) {
        clipNow = t.clip;
        if (clipNow) portal.setAttribute("clip-path", clipNow);
        else portal.removeAttribute("clip-path");
      }
      var s = scaleAt(a.y);
      var M = svg.createSVGMatrix()
        .translate(a.x, a.y - (a.dip || 0))
        .scale(s)
        .scaleNonUniform(a.face || 1, 1)          // 1 faces left, -1 faces right
        .translate(-SRC_X, -SRC_Y);
      walker.setAttribute("transform", matStr(matIn(portal.parentNode).inverse().multiply(M)));
    };
    a.step = function (nx, ny) {
      var r = attempt(a, nx, ny) || attempt(a, nx, a.y) || attempt(a, a.x, ny);
      if (r) { a.x = r.x; a.y = r.y; a.level = r.level; a.lane = r.lane; }
      a.apply();
      return !!r;
    };
    a.goTo = function (tx, ty, again) {
      if (!again) { a.goal = { x: tx, y: ty }; a.retries = 0; }
      var r = buildRoute(a, tx, ty);
      if (!r || !r.length) { a.route = null; return false; }
      a.route = r; a.at = 0;
      return true;
    };
    a.destroy = function () {
      if (portal.parentNode) portal.parentNode.removeChild(portal);
      var i = crowd.indexOf(a);
      if (i >= 0) crowd.splice(i, 1);
    };
    a.hide = function () { portal.style.display = "none"; };
    a.show = function () { portal.style.display = ""; };
    a.stop = function () {
      a.route = null; a.goal = null; a.arriveCb = null;
      a.vel.x = a.vel.y = 0;
    };
    // Wedged on a corner: shove off in whatever direction is open. Cheap
    // insurance so nobody can end up parked against a wall forever.
    a.escape = function () {
      var step = Math.max(0.8, SPEED * scaleAt(a.y) * 2);
      for (var i = 0; i < 8; i++) {
        var ang = i * Math.PI / 4;
        var r = attempt(a, a.x + Math.cos(ang) * step, a.y + Math.sin(ang) * step);
        if (r) { a.x = r.x; a.y = r.y; a.level = r.level; a.lane = r.lane; a.apply(); return true; }
      }
      return false;
    };

    a.advance = function (dt, drive) {
      var pace = SPEED * scaleAt(a.y) * paceOf(a) * (a.speedMul || 1);
      var wantX = 0, wantY = 0;

      if (drive && (drive.x || drive.y)) {
        var n = Math.hypot(drive.x, drive.y);
        wantX = pace * drive.x / n; wantY = pace * drive.y / n;
      } else if (a.route) {
        while (a.at < a.route.length - 1 &&
               Math.hypot(a.route[a.at].x - a.x, a.route[a.at].y - a.y) < Math.max(0.5, pace * dt * 1.2)) {
          a.at++;
        }
        var w = a.route[a.at];
        var dx = w.x - a.x, dy = w.y - a.y, d = Math.hypot(dx, dy);
        var end = a.route[a.route.length - 1];
        var toEnd = Math.hypot(end.x - a.x, end.y - a.y);
        if (a.at >= a.route.length - 1 && d < Math.max(0.35, pace * dt)) {
          a.step(w.x, w.y);
          a.route = null; a.goal = null;
          a.vel.x = a.vel.y = 0;
          if (a.arriveCb) { var cb = a.arriveCb; a.arriveCb = null; cb(a); }
        } else if (d > 0.0001) {
          var slow = Math.min(1, toEnd / BRAKE);
          wantX = pace * slow * dx / d;
          wantY = pace * slow * dy / d;
        }
      }

      var k = Math.min(1, TURN * dt);
      a.vel.x += (wantX - a.vel.x) * k;
      a.vel.y += (wantY - a.vel.y) * k;

      if (a.vel.x > 0.02 && a.face !== -1)      { a.face = -1; a.apply(); }
      else if (a.vel.x < -0.02 && a.face !== 1)  { a.face = 1;  a.apply(); }

      if (Math.abs(a.vel.x) > 0.0005 || Math.abs(a.vel.y) > 0.0005) {
        var px = a.x, py = a.y;
        a.step(a.x + a.vel.x * dt, a.y + a.vel.y * dt);
        var moved = Math.hypot(a.x - px, a.y - py);
        if (a.route && moved < pace * dt * 0.2) {
          a.stallT += dt * 16.667;
          if (a.stallT > 400) {
            a.stallT = 0;
            a.vel.x = a.vel.y = 0;
            a.escape();
            if (a.goal && a.retries < 3) { a.retries++; a.goTo(a.goal.x, a.goal.y, true); }
            else { a.route = null; a.goal = null; a.arriveCb = null; }
          }
        } else {
          a.stallT = 0;
        }
      }
    };

    // A quick dip, for putting something in a bin.
    var bobT = 0, bobMs = 0;
    a.bob = function (ms) { bobT = 0; bobMs = ms; };
    a.bobOffset = function (dt) {
      if (bobMs <= 0) return 0;
      bobT += dt * 16.667;
      if (bobT >= bobMs) { bobMs = 0; return 0; }
      return Math.sin(bobT / bobMs * Math.PI) * 1.6;
    };

    var mark = svgEl("text");
    mark.setAttribute("x", 170.7);
    mark.setAttribute("y", 184);
    mark.setAttribute("text-anchor", "middle");
    mark.setAttribute("style", "font:bold 13px sans-serif;fill:#d02020;stroke:#1a1a1a;stroke-width:0.6;display:none");
    mark.textContent = "!";
    node.appendChild(mark);
    var grumbleMs = 0;
    a.grumble = function (ms) {
      grumbleMs = ms; mark.style.display = "";
      HA.tone({ f: 300, to: 180, dur: .22, type: "square", vol: .14 });
    };
    a.grumbleTick = function (dt) {
      if (grumbleMs <= 0) return;
      grumbleMs -= dt * 16.667;
      if (grumbleMs <= 0) mark.style.display = "none";
    };

    a.hasCup = false;
    a.cupUntil = 0;
    a.giveCup = function (now) {
      a.hasCup = true;
      a.cupUntil = (now || 0) + rnd(5000, 10000);   // they finish it before binning it
      cupEl.style.display = "";
    };
    a.dropCup = function () { a.hasCup = false; cupEl.style.display = "none"; };
    a.ticket = null;
    a.giveTicket = function (key, colour) {
      a.ticket = key;
      tkEl.style.fill = colour;
      tkEl.style.display = "";
    };
    a.dropTicket = function () { a.ticket = null; tkEl.style.display = "none"; };

    a.apply();
    return a;
  }

  var CLEAN = meepleSrc.cloneNode(true);      // before the worker gets dressed
  stripIds(CLEAN);

  function tint(node, body, head) {
    var parts = node.querySelectorAll("path");
    for (var i = 0; i < parts.length; i++) {

      el("path", { d: "m 164.6,204.4 h 13.6 v 1.9 h -13.6 z" }, "#3f4a55");   // seat
      el("path", { d: "m 176.4,206.0 h 2.2 l 1.1,4.6 h -2.2 z" }, "#3f4a55"); // footrest

  }

  function spawn(d) {

  /* ================= the barista =================================================
     The cafe front is a wall with a window cut in it. Inside, the dark panel is
     the back of the shop and the tan shape is the counter. That tan shape is one
     path holding two things: a thin back edge along the top and the wide front
     band. Painting him behind the whole thing put the back edge straight through
     his head, so it gets split and he goes between the two: over the dark panel
     and the back edge, under the front band. Clipped to the window so nothing
     escapes onto the sign.                                                    */

  (function () {

    winClip.appendChild(winPoly);

  /* ================= the player ================================================== */

  var keys = {};
  var MAP = { ArrowLeft: "l", ArrowRight: "r", ArrowUp: "u", ArrowDown: "d",

  /* ================= the regulars ================================================
     Errands are a queue of places with a dwell time. Everything they do goes
     through the same router the player uses, so they use the lanes head on and
     obey the same one way rule.                                               */

  var WANDER = [
    { x: 40,  y: 195 }, { x: 100, y: 190 }, { x: 165, y: 195 },
    { x: 60,  y: 215 }, { x: 150, y: 218 }, { x: 105, y: 222 },
    { x: 30,  y: 170 }, { x: 175, y: 172 }
  ];
  var PLATFORMS = [
    { x: 60,  y: 152 }, { x: 150, y: 152 }, { x: 100, y: 135 },
    { x: 88,  y: 125 }, { x: 118, y: 125 }, { x: 105, y: 160 }
  ];
  var UBAHN = [
    { x: 30,  y: 274 }, { x: 90,  y: 276 }, { x: 150, y: 274 }, { x: 185, y: 276 }
  ];
  var CAFE_FRONT = [{ x: 193, y: 186 }, { x: 190, y: 183 }, { x: 196, y: 190 }];
  var TICKETS    = [{ x: 103, y: 150 }, { x: 108, y: 151 }, { x: 100, y: 150 }];

  // In the door, sideways into that stall so the wall hides him, then back out
  // the way he came. The divider makes the shortcut through the other door
  // impossible, so this cannot go wrong even if a route is replanned.
  var WC = propByKey("g98");
  var DOOR_MID = DOORS.length === 2 ? (DOORS[0].cx + DOORS[1].cx) / 2 : 0;

  function errandToilet(a) {
    var d = pick(DOORS);
    var ix = d.cx + (d.cx < DOOR_MID ? 2.5 : -2.5);
    travelTo(a, { x: d.cx, y: baseAt(WC, d.cx) - 1 }, 250, function (who) {

    });
    a.errands.push({ pt: { x: ix, y: baseAt(WC, ix) - 6 }, wait: rnd(1800, 4200) });
    a.errands.push({ pt: { x: d.cx, y: baseAt(WC, d.cx) - 1 }, wait: 250 });
    a.errands.push({ pt: { x: d.cx, y: baseAt(WC, d.cx) + 6 }, wait: rnd(300, 900) });
  }
  var TOILET_COOLDOWN = [60000, 120000];   // nobody needs it twice in a row

  function errandBin(a) {
    var bin = pick(BINS);
    travelTo(a, bin.stand, rnd(500, 1200), function (who) {
      useBin(who, bin);
      if (who.dropCup) who.dropCup();
    });
  }

  function nextErrand(a, now) {
    var roll = Math.random();
    if (roll < 0.15 && now > a.toiletOK) {
      errandToilet(a);
      a.toiletOK = now + rnd(TOILET_COOLDOWN[0], TOILET_COOLDOWN[1]);
      return;
    }
    var binOk = !a.hasCup || now > a.cupUntil;              // no beeline to the bin
    if (a.hasCup && binOk && roll < 0.6) { errandBin(a); return; }
    if (roll < 0.30)      { if (binOk) errandBin(a); else travelTo(a, pick(WANDER), rnd(800, 2500)); }
    else if (roll < 0.46) { if (!errandCafe(a)) errandBin(a); }
    else if (roll < 0.58) { if (!errandTicket(a)) errandRide(a); }
    else if (roll < 0.64) { if (a.ticket) errandRide(a); else if (!errandTicket(a)) errandRide(a); }
    else if (roll < 0.72) travelTo(a, pick(UBAHN),      rnd(1500, 4000));
    else if (roll < 0.88) travelTo(a, pick(PLATFORMS),  rnd(2000, 5000));
    else                  travelTo(a, pick(WANDER),     rnd(800, 2500));
  }

  var SKIN = ["#f6c28b", "#d9a066", "#c98f5c", "#eab98f", "#b87a4e"];
  var HAIR = ["#3b2b1d", "#c9a227", "#5a3921", "#2f2f2f", "#8c6239", "#a33b2a"];
  var COATS = ["#e4572e", "#8ac926", "#c77dff", "#ffca3a", "#4f9d8f", "#2a6f97",
               "#d1495b", "#f28f3b", "#5f6caf", "#7bb661", "#b5651d", "#3d5a80"];

  var CROWD = [
    { x: 45,  y: 196 }, { x: 150, y: 200 }, { x: 100, y: 218 }, { x: 175, y: 186 },
    { x: 70,  y: 190 }, { x: 52,  y: 222 }, { x: 140, y: 224 },
    // the ones who need the lift
    { x: 62,  y: 212, head: "#dcdcdc", hat: "#4a4a4a", liftPrefers: true, speedMul: 0.62 },
    { x: 130, y: 212, head: "#dcdcdc", hair: "#bfbfbf", liftPrefers: true, speedMul: 0.6 },
    { x: 88,  y: 214, wheels: true, liftOnly: true, speedMul: 0.85 },
    { x: 118, y: 216, hair: "#5a3921", pram: true, liftOnly: true, speedMul: 0.8 }
  ];
  var crowd = CROWD.map(function (c, i) {
    c.body = c.body || COATS[i % COATS.length];
    c.head = c.head || SKIN[i % SKIN.length];
    if (!c.hat && !c.hair && !c.wheels && i % 3 === 0) c.hair = HAIR[i % HAIR.length];
    if (!c.hat && !c.hair && i % 5 === 0) c.hat = HAIR[(i + 2) % HAIR.length];
    var a = spawn(c);
    a.toiletOK = rnd(4000, 60000);
    return a;
  });
  function allActors() { return [player].concat(crowd); }

  // A newcomer, off a train or a bus.
  function spawnRandom(x, y) {
    var i = Math.floor(Math.random() * 1000);
    var d = { x: x, y: y,
              body: pick(COATS), head: pick(SKIN) };
    var r = Math.random();
    if (r < 0.22) d.hair = pick(HAIR);
    else if (r < 0.38) d.hat = pick(HAIR);
    if (r > 0.93) { d.head = "#dcdcdc"; d.liftPrefers = true; d.speedMul = 0.62; }
    else if (r > 0.90) { d.wheels = true; d.liftOnly = true; d.speedMul = 0.85; }
    else if (r > 0.87) { d.pram = true; d.liftOnly = true; d.speedMul = 0.8; }
    var a = spawn(d);
    a.toiletOK = CLOCK + rnd(20000, 90000);
