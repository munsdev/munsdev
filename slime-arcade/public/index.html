<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Henry's Arcade</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F57D0D">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Henry's Arcade">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@600;800&display=swap">
<style>
  :root{
    --slime:#8DC63F;
    --slime-dark:#5E9017;
    --orange:#F57D0D;
    --pink:#FF4FA3;
    --cyan:#22CFE0;
    --purple:#7A3FBF;
    --sun:#FFD23F;
    --ink:#241A2E;
    --cream:#FFF3D6;
    --display:"Bungee","Baloo 2",system-ui,sans-serif;
    --round:"Baloo 2","Bungee",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--orange);
    color:var(--ink);
    font-family:var(--round);
    overflow:hidden;
    touch-action:manipulation;
    user-select:none;
  }

  /* ---------- app frame ---------- */
  #app{position:fixed;inset:0;overflow:hidden}
  .screen{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;
    padding:clamp(10px,2.2vmin,22px);
    gap:clamp(8px,1.6vmin,18px);
    overflow:hidden;
  }
  .screen.on{display:flex}

  /* splatter wallpaper */
  .splats{position:absolute;inset:0;pointer-events:none;opacity:.5}
  .splats span{
    position:absolute;display:block;
    border-radius:60% 40% 55% 45%/50% 60% 40% 50%;
    animation:drift 9s ease-in-out infinite;
  }
  @keyframes drift{0%,100%{transform:translate3d(0,0,0) rotate(0deg)}50%{transform:translate3d(0,-14px,0) rotate(9deg)}}

  /* ---------- language switch ---------- */
  .langSwitch{
    position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:60;
    display:flex;gap:6px;background:rgba(36,26,46,.55);
    padding:5px;border-radius:16px;
  }
  .langSwitch button{
    font-family:var(--round);font-weight:800;font-size:14px;
    border:3px solid var(--ink);border-radius:11px;
    padding:.35em .7em;background:#fff;color:var(--ink);
    cursor:pointer;min-width:2.6em;
    transition:transform .08s;
  }
  .langSwitch button.active{background:var(--slime);color:#fff;box-shadow:0 3px 0 var(--ink)}
  .langSwitch button:active{transform:translateY(2px)}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:12px;position:relative;z-index:3;flex:0 0 auto}
  .back{
    font-family:var(--display);
    font-size:clamp(18px,3.4vmin,30px);
    color:#fff;background:var(--slime);
    border:5px solid var(--ink);
    border-radius:22px;
    padding:.45em .8em;
    box-shadow:0 7px 0 var(--ink);
    cursor:pointer;
    transition:transform .08s;
    white-space:nowrap;
  }
  .back:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
  .title{
    flex:1 1 auto;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-family:var(--display);
    color:#fff;
    font-size:clamp(20px,4.6vmin,44px);
    letter-spacing:.02em;
    text-shadow:3px 3px 0 var(--ink);
    transform:rotate(-2deg);
    padding-left:.15em;
  }

  /* ---------- home ---------- */
  .logo{
    text-align:center;position:relative;z-index:3;flex:0 0 auto;
    padding-top:clamp(4px,1.5vmin,18px);
  }
  .logo .blob{
    display:inline-block;background:var(--slime);
    border:6px solid var(--ink);
    border-radius:46% 54% 40% 60%/58% 42% 60% 42%;
    padding:.35em .9em .45em;
    box-shadow:0 10px 0 var(--ink);
    transform:rotate(-3deg);
    animation:bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(2deg) translateY(-10px)}}
  .logo h1{
    font-family:var(--display);
    font-size:clamp(30px,8vmin,78px);
    color:#fff;
    text-shadow:5px 5px 0 var(--ink);
    line-height:1;
  }
  .logo p{
    font-family:var(--round);font-weight:800;
    color:#fff;font-size:clamp(13px,2.4vmin,22px);
    text-shadow:2px 2px 0 var(--ink);
    margin-top:.35em;
  }

  .menu{
    flex:1 1 auto;position:relative;z-index:3;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-auto-rows:minmax(96px,1fr);
    gap:clamp(6px,1.3vmin,14px);
    padding:clamp(6px,1.5vmin,16px) 0 clamp(2px,1vmin,10px);
    min-height:0;
    overflow-y:auto;
  }
  .tile{
    border:8px solid var(--ink);
    border-radius:38px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.15em;
    cursor:pointer;
    box-shadow:0 12px 0 var(--ink);
    font-family:var(--display);
    color:#fff;
    font-size:clamp(14px,3vmin,30px);
    text-shadow:3px 3px 0 rgba(0,0,0,.35);
    transition:transform .1s;
    min-height:0;
  }
  .tile .ico{font-size:clamp(32px,10vmin,78px);line-height:1;margin-bottom:.08em;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.3))}
  .tile:active{transform:translateY(10px) scale(.97);box-shadow:0 2px 0 var(--ink)}
  .tile.t1{background:var(--pink);transform:rotate(-2deg)}
  .tile.t2{background:var(--cyan);transform:rotate(2deg)}
  .tile.t3{background:var(--purple);transform:rotate(1.5deg)}
  .tile.t4{background:var(--sun);color:var(--ink);text-shadow:3px 3px 0 rgba(255,255,255,.5);transform:rotate(-1.5deg)}
  .tile.t5{background:var(--slime);transform:rotate(-1.5deg)}
  .tile.t6{background:#EF3E36;transform:rotate(2deg)}
  .tile.t7{background:#8B5A2B;transform:rotate(-1deg)}
  .tile.t7{grid-column:1 / -1}
  .tile.t1:active,.tile.t2:active,.tile.t3:active,.tile.t4:active,.tile.t5:active,.tile.t6:active,.tile.t7:active{transform:translateY(10px) scale(.97)}

  /* ---------- shared play area ---------- */
  .stage{
    flex:1 1 auto;position:relative;z-index:3;min-height:0;
    background:rgba(255,255,255,.22);
    border:6px solid var(--ink);
    border-radius:34px;
    padding:clamp(8px,1.8vmin,20px);
    display:flex;flex-direction:column;gap:clamp(8px,1.6vmin,16px);
    overflow:hidden;
  }
  .pad-grid{
    flex:1 1 auto;display:grid;gap:clamp(4px,1vmin,10px);min-height:0;
  }
  .pad{
    border:7px solid var(--ink);
    border-radius:28px;
    box-shadow:0 9px 0 var(--ink);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);
    color:#fff;
    transition:transform .09s;
    min-height:0;position:relative;overflow:hidden;
  }
  .pad:active{transform:translateY(8px) scale(.96);box-shadow:0 1px 0 var(--ink)}
  .pad.pop{animation:pop .5s ease-out}
  @keyframes pop{
    0%{transform:scale(1); box-shadow:0 9px 0 var(--ink), 0 0 0 0 rgba(255,255,255,.85)}
    35%{transform:scale(1.16) rotate(-4deg); box-shadow:0 9px 0 var(--ink), 0 0 0 9px rgba(255,255,255,.45)}
    70%{transform:scale(.94) rotate(3deg); box-shadow:0 9px 0 var(--ink), 0 0 0 15px rgba(255,255,255,0)}
    100%{transform:scale(1); box-shadow:0 9px 0 var(--ink), 0 0 0 15px rgba(255,255,255,0)}
  }

  /* readout bar */
  .readout{
    flex:0 0 auto;
    background:var(--ink);color:var(--cream);
    border-radius:20px;
    font-family:var(--display);
    font-size:clamp(16px,3.6vmin,34px);
    text-align:center;
    padding:.3em .4em;
    letter-spacing:.03em;
    min-height:1.6em;
  }
  .readout.flash{animation:flash .4s}
  @keyframes flash{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

  /* ---------- shapes ---------- */
  #shapes .pad-grid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
  .shape{width:min(70%,26vmin);aspect-ratio:1;background:#fff;box-shadow:0 0 0 5px var(--ink) inset}
  .sh-circle{border-radius:50%}
  .sh-square{border-radius:8px}
  .sh-tri{clip-path:polygon(50% 2%,100% 100%,0 100%);box-shadow:none;border:none;background:#fff}
  .sh-star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);box-shadow:none}
  .sh-heart{clip-path:path("M50 90 C 10 60, 0 30, 22 14 C 36 4, 50 14, 50 26 C 50 14, 64 4, 78 14 C 100 30, 90 60, 50 90 Z");box-shadow:none;width:min(76%,28vmin)}
  .sh-diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:none}

  /* giant celebration shape */
  #bigShape{
    position:absolute;inset:0;margin:auto;
    width:min(46vmin,300px);height:min(46vmin,300px);
    pointer-events:none;opacity:0;z-index:5;
  }
  #bigShape.go{animation:bigpop 1s ease-out}
  @keyframes bigpop{
    0%{opacity:0;transform:scale(.2) rotate(-25deg)}
    30%{opacity:1;transform:scale(1.1) rotate(8deg)}
    70%{opacity:1;transform:scale(1) rotate(-4deg)}
    100%{opacity:0;transform:scale(1.35) rotate(10deg)}
  }

  /* ---------- colors ---------- */
  #colors .pad-grid{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}
  .swatch{border-radius:50% 42% 58% 45%/48% 55% 45% 52%}

  /* ---------- numbers ---------- */
  #numbers .pad-grid{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);flex:0 0 auto;height:41%}
  #numbers .pad{font-size:clamp(20px,5.5vmin,50px);background:var(--purple)}
  #numbers .pad:nth-child(even){background:var(--pink)}
  .tray{
    flex:1 1 auto;min-height:0;
    background:rgba(255,255,255,.6);
    border:6px dashed var(--ink);
    border-radius:26px;
    display:flex;flex-wrap:wrap;align-content:center;justify-content:center;
    gap:clamp(4px,1.4vmin,14px);
    padding:clamp(6px,1.4vmin,14px);
    overflow:hidden;
  }
  .goo{
    width:clamp(26px,7vmin,64px);aspect-ratio:1;
    background:var(--slime);
    border:4px solid var(--ink);
    border-radius:52% 48% 44% 56%/56% 44% 56% 44%;
    animation:drop .5s cubic-bezier(.2,1.6,.5,1) both, wob 1.8s ease-in-out infinite .5s;
  }
  @keyframes drop{from{transform:translateY(-120px) scale(.3);opacity:0}to{transform:none;opacity:1}}
  @keyframes wob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(5deg)}}

  /* ---------- sounds ---------- */
  #sounds .pad-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
  #sounds .pad{font-size:clamp(56px,18vmin,130px);text-shadow:none}

  /* ---------- letters ---------- */
  #letters .pad-grid{
    grid-template-columns:repeat(4,1fr);
    grid-auto-rows:minmax(64px,1fr);
    overflow-y:auto;
  }
  #letters .pad{font-size:clamp(24px,6.5vmin,52px)}
  #bigLetter{
    position:absolute;inset:0;margin:auto;
    width:min(60vmin,340px);height:min(60vmin,340px);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);
    font-size:min(40vmin,220px);
    color:#fff;
    text-shadow:6px 6px 0 var(--ink);
    pointer-events:none;opacity:0;z-index:5;
  }
  #bigLetter.go{animation:bigpop 1s ease-out}

  /* ---------- draw ---------- */
  .swatchRow{
    flex:0 0 auto;display:flex;justify-content:center;
    gap:clamp(6px,1.6vmin,14px);flex-wrap:wrap;
  }
  .swatchBtn{
    width:clamp(30px,8vmin,52px);aspect-ratio:1;
    border:4px solid var(--ink);border-radius:50%;
    box-shadow:0 4px 0 var(--ink);
    cursor:pointer;transition:transform .08s;
  }
  .swatchBtn.selected{transform:scale(1.22);box-shadow:0 0 0 4px #fff, 0 0 0 8px var(--ink)}
  .swatchBtn:active{transform:scale(.92)}
  .eraserBtn{
    width:clamp(34px,9vmin,58px);height:clamp(30px,8vmin,52px);
    border:4px solid var(--ink);border-radius:10px;
    background:linear-gradient(90deg,#fff 0 55%,#FF9FCB 55% 100%);
    box-shadow:0 4px 0 var(--ink);
    cursor:pointer;transition:transform .08s;
    position:relative;
  }
  .eraserBtn::after{
    content:"";position:absolute;left:52%;top:15%;bottom:15%;width:2px;
    background:var(--ink);opacity:.5;
  }
  .eraserBtn.selected{transform:scale(1.18);box-shadow:0 0 0 4px #fff, 0 0 0 8px var(--ink)}
  .eraserBtn:active{transform:scale(.92)}
  .clearBtn{
    flex:0 0 auto;
    font-family:var(--display);
    font-size:clamp(12px,2.2vmin,18px);
    color:#fff;background:var(--pink);
    border:5px solid var(--ink);border-radius:18px;
    padding:.35em .55em;
    box-shadow:0 6px 0 var(--ink);
    cursor:pointer;white-space:nowrap;
    transition:transform .08s;
  }
  .clearBtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
  #drawCanvas{
    flex:1 1 auto;width:100%;min-height:0;
    background:#fff;
    border:6px solid var(--ink);border-radius:26px;
    touch-action:none;display:block;
  }

  /* ---------- train ---------- */
  .trainStage{
    flex:1 1 auto;position:relative;z-index:3;min-height:0;
    border-radius:34px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .trainStage svg.track{position:absolute;inset:0;width:100%;height:100%}
  /* Top-down silhouette (not a side elevation) so offset-rotate:auto can
     spin it a full 360 degrees around the loop without ever reading as
     "upside-down" -- a bird's-eye shape has no fixed up/down to violate. */
  .train, .car{
    position:absolute;top:0;left:0;
    transform-origin:center;
    will-change:offset-distance;
  }
  .train{width:clamp(64px,15vmin,108px);aspect-ratio:2.15/1}
  .car{width:clamp(46px,10.5vmin,80px);aspect-ratio:1.7/1}
  .train.running, .car.running{animation:trainBob .5s ease-in-out infinite}
  @keyframes trainBob{0%,100%{translate:0 0}50%{translate:0 -3%}}
  .loco-cab{
    position:absolute;inset:2% 62% 2% 0;
    background:#EF3E36;border:4px solid var(--ink);border-radius:22%;
  }
  .loco-window{
    position:absolute;inset:26% 72% 26% 14%;
    background:#FFD23F;border:3px solid var(--ink);border-radius:35%;
  }
  .loco-boiler{
    position:absolute;inset:10% 0 10% 34%;
    background:#3A3A44;border:4px solid var(--ink);
    border-radius:14% 46% 14% 46%/40% 40% 40% 40%;
  }
  .loco-stack{
    position:absolute;left:44%;top:50%;width:15%;aspect-ratio:1;
    transform:translateY(-50%);
    background:var(--ink);border:3px solid var(--ink);border-radius:50%;
  }
  .car-body{
    position:absolute;inset:14% 4%;
    border:4px solid var(--ink);border-radius:24%;
    background:var(--car-color,#22CFE0);
  }
  .wheel{
    position:absolute;width:15%;aspect-ratio:1;
    background:var(--ink);border:3px solid var(--ink);border-radius:50%;
    animation:wheelSpin .6s linear infinite;animation-play-state:paused;
  }
  .wheel::after{content:"";position:absolute;inset:26%;background:#FFD23F;border-radius:50%}
  .wheel.wa{left:18%;top:-10%}
  .wheel.wb{left:18%;bottom:-10%}
  .wheel.wc{left:58%;top:-10%}
  .wheel.wd{left:58%;bottom:-10%}
  .car .wheel.wc{left:64%}
  .car .wheel.wd{left:64%}
  @keyframes wheelSpin{to{transform:rotate(360deg)}}
  .train.running .wheel, .car.running .wheel{animation-play-state:running}
  #trackSvg .railDash{will-change:stroke-dashoffset}
  .controlCard{
    position:relative;z-index:4;
    width:min(80vw,320px);max-width:100%;
    background:rgba(255,255,255,.85);
    border:6px solid var(--ink);border-radius:28px;
    box-shadow:0 10px 0 var(--ink);
    padding:clamp(10px,2.4vw,18px);
    display:flex;flex-direction:column;gap:clamp(8px,1.8vw,14px);
    box-sizing:border-box;
  }
  .ctrlRow{display:flex;gap:clamp(6px,1.6vw,12px)}
  .ctrlBtn{
    flex:1 1 0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;
    font-family:var(--round);font-weight:800;
    font-size:clamp(10px,2vw,14px);
    color:#fff;
    border:5px solid var(--ink);border-radius:18px;
    box-shadow:0 6px 0 var(--ink);
    padding:.5em .2em;
    cursor:pointer;transition:transform .08s;
  }
  .ctrlBtn .glyph{font-size:clamp(20px,4.6vw,32px);line-height:1}
  .ctrlBtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
  .ctrlBtn.fwd{background:var(--slime)}
  .ctrlBtn.stop{background:#EF3E36}
  .ctrlBtn.back{background:var(--cyan)}
  .whistleBtn{
    font-family:var(--display);
    font-size:clamp(15px,3vw,22px);
    color:var(--ink);background:var(--sun);
    border:5px solid var(--ink);border-radius:18px;
    padding:.4em .6em;
    box-shadow:0 6px 0 var(--ink);
    cursor:pointer;transition:transform .08s;
  }
  .whistleBtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
  .speedRow{display:flex;align-items:center;gap:clamp(6px,1.6vw,10px)}
  .speedRow .emo{font-size:clamp(16px,3.4vw,24px)}
  .speedRow input[type="range"]{
    flex:1 1 auto;-webkit-appearance:none;appearance:none;
    height:10px;border-radius:6px;
    background:var(--purple);border:3px solid var(--ink);
  }
  .speedRow input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:clamp(24px,5vw,36px);height:clamp(24px,5vw,36px);
    border-radius:50%;background:var(--sun);
    border:4px solid var(--ink);cursor:pointer;
  }
  .speedRow input[type="range"]::-moz-range-thumb{
    width:clamp(24px,5vw,36px);height:clamp(24px,5vw,36px);
    border-radius:50%;background:var(--sun);
    border:4px solid var(--ink);cursor:pointer;
  }

  /* ---------- particles ---------- */
  .bit{position:fixed;pointer-events:none;z-index:99;border-radius:50% 45% 55% 42%/50% 55% 45% 50%;border:3px solid var(--ink)}

  @media (max-width:520px){
    .tile{border-radius:28px}
    .stage{border-radius:26px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
  }
  :focus-visible{outline:5px solid #fff;outline-offset:3px}
</style>
</head>
<body>

<div class="langSwitch" id="langSwitch">
  <button type="button" data-lang="en">EN</button>
  <button type="button" data-lang="de">DE</button>
</div>

<div id="app">
  <!-- ============ HOME ============ -->
  <section class="screen on" id="home" style="background:var(--orange)">
    <div class="splats" data-splats></div>
    <div class="logo">
      <span class="blob"><h1>HENRY'S<br>ARCADE</h1></span>
      <p data-tagline></p>
    </div>
    <div class="menu">
      <button class="tile t1" data-go="shapes"><span class="ico">&#128314;</span><span data-tile="shapes"></span></button>
      <button class="tile t2" data-go="colors"><span class="ico">&#127912;</span><span data-tile="colors"></span></button>
      <button class="tile t3" data-go="numbers"><span class="ico">&#128290;</span><span data-tile="numbers"></span></button>
      <button class="tile t4" data-go="sounds"><span class="ico">&#128266;</span><span data-tile="sounds"></span></button>
      <button class="tile t5" data-go="letters"><span class="ico">&#128292;</span><span data-tile="letters"></span></button>
      <button class="tile t6" data-go="draw"><span class="ico">&#9999;&#65039;</span><span data-tile="draw"></span></button>
      <button class="tile t7" data-go="train"><span class="ico">&#128642;</span><span data-tile="train"></span></button>
    </div>
  </section>

  <!-- ============ SHAPES ============ -->
  <section class="screen" id="shapes" style="background:var(--pink)">
    <div class="splats" data-splats></div>
    <header>
      <button class="back" data-go="home">&#9664; <span data-home></span></button>
      <span class="title" data-title="shapes"></span>
    </header>
    <div class="stage">
      <div class="readout" id="shapeWord"></div>
      <div class="pad-grid" id="shapeGrid"></div>
      <div id="bigShape"></div>
    </div>
  </section>

  <!-- ============ COLORS ============ -->
  <section class="screen" id="colors" style="background:var(--cyan)">
    <div class="splats" data-splats></div>
    <header>
      <button class="back" data-go="home">&#9664; <span data-home></span></button>
      <span class="title" data-title="colors"></span>
    </header>
    <div class="stage">

</div>

<script>
(function(){
  "use strict";
  const PALETTE = ["#8DC63F","#F57D0D","#FF4FA3","#22CFE0","#7A3FBF","#FFD23F"];
  const $ = s => document.querySelector(s);
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- i18n ---------------- */
  const STR = {
    en: {
      docTitle: "Henry's Arcade",
      speechLang: "en-US",
      tagline: "PICK A GAME! TAP ANYTHING!",
      home: "HOME",
      titles:  { shapes:"SHAPES!", colors:"COLORS!", numbers:"COUNT!", sounds:"SOUNDS!", letters:"LETTERS!", draw:"DRAW!", train:"TRAIN!" },
      tiles:   { shapes:"SHAPES", colors:"COLORS", numbers:"COUNT", sounds:"SOUNDS", letters:"LETTERS", draw:"DRAW", train:"TRAIN" },
      hints:   { shape:"TAP A SHAPE", color:"TAP A COLOR", number:"TAP A NUMBER", sound:"TAP TO MAKE NOISE", letter:"TAP A LETTER" },
      shapeNames: { circle:"CIRCLE", square:"SQUARE", triangle:"TRIANGLE", star:"STAR", heart:"HEART", diamond:"DIAMOND" },
      colorNames: { red:"RED", orange:"ORANGE", yellow:"YELLOW", green:"GREEN", blue:"BLUE", purple:"PURPLE", pink:"PINK", brown:"BROWN" },
      numWords: ["ONE","TWO","THREE","FOUR","FIVE","SIX","SEVEN","EIGHT","NINE","TEN"],
      soundNames: { honk:"HONK", drum:"DRUM", zap:"ZAP", cheer:"CHEER" },
      clearLabel: "CLEAR",
      ctrl: { back:"BACK", stop:"STOP", fwd:"GO", whistle:"WHISTLE!" }
    },
    de: {
      docTitle: "Henrys Arcade",
      speechLang: "de-DE",
      tagline: "WÄHL EIN SPIEL! TIPP ÜBERALL!",
      home: "HAUS",
      titles:  { shapes:"FORMEN!", colors:"FARBEN!", numbers:"ZÄHLEN!", sounds:"GERÄUSCHE!", letters:"BUCHSTABEN!", draw:"MALEN!", train:"ZUG!" },
      tiles:   { shapes:"FORMEN", colors:"FARBEN", numbers:"ZÄHLEN", sounds:"GERÄUSCHE", letters:"BUCHSTABEN", draw:"MALEN", train:"ZUG" },
      hints:   { shape:"TIPP EINE FORM", color:"TIPP EINE FARBE", number:"TIPP EINE ZAHL", sound:"TIPPEN FÜR KNALL", letter:"TIPP EINEN BUCHSTABEN" },
      shapeNames: { circle:"KREIS", square:"QUADRAT", triangle:"DREIECK", star:"STERN", heart:"HERZ", diamond:"RAUTE" },
      colorNames: { red:"ROT", orange:"ORANGE", yellow:"GELB", green:"GRÜN", blue:"BLAU", purple:"LILA", pink:"PINK", brown:"BRAUN" },
      numWords: ["EINS","ZWEI","DREI","VIER","FÜNF","SECHS","SIEBEN","ACHT","NEUN","ZEHN"],
      soundNames: { honk:"TUT", drum:"TROMMEL", zap:"ZISCH", cheer:"JUBEL" },
      clearLabel: "LÖSCHEN",
      ctrl: { back:"ZURÜCK", stop:"STOPP", fwd:"LOS", whistle:"PFEIFE!" }
    }
  };
  let lang = localStorage.getItem("slimeLang");
  if(lang !== "en" && lang !== "de"){
    lang = (navigator.language || "").toLowerCase().indexOf("de") === 0 ? "de" : "en";
  }
  const t = () => STR[lang];

  /* ---------------- audio ---------------- */
  let ctx = null;
  function ac(){
    if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(opts){
    const a = ac(); if(!a) return;
    const tm = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = opts.type || "sine";
    o.frequency.setValueAtTime(opts.f, tm + (opts.at||0));
    if(opts.to) o.frequency.exponentialRampToValueAtTime(opts.to, tm + (opts.at||0) + (opts.dur||.3));
    g.gain.setValueAtTime(0.0001, tm + (opts.at||0));
    g.gain.exponentialRampToValueAtTime(opts.vol||0.28, tm + (opts.at||0) + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, tm + (opts.at||0) + (opts.dur||.3));
    o.connect(g); g.connect(a.destination);
    o.start(tm + (opts.at||0)); o.stop(tm + (opts.at||0) + (opts.dur||.3) + .05);
  }
  function noise(dur, at, filterFreq, vol){
    const a = ac(); if(!a) return;
    const tm = a.currentTime + (at||0);
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type="lowpass"; f.frequency.value = filterFreq||1400;
    const g = a.createGain(); g.gain.value = vol != null ? vol : 0.4;
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(tm);
  }
  function say(text){
    if(!("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = t().speechLang;
      u.rate = .85; u.pitch = 1.5; u.volume = 1;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---------------- particles ---------------- */
  function burst(x, y, colors, count){
    if(reduced) return;
    const n = count || 12;
    for(let i=0;i<n;i++){
      const b = document.createElement("div");
      b.className = "bit";
      const size = 10 + Math.random()*26;
      const col = colors[Math.floor(Math.random()*colors.length)];
      b.style.cssText = "width:"+size+"px;height:"+size+"px;background:"+col+";left:"+(x-size/2)+"px;top:"+(y-size/2)+"px;";
      document.body.appendChild(b);
      const ang = Math.random()*Math.PI*2, dist = 60 + Math.random()*190;
      b.animate([
        {transform:"translate(0,0) scale(.4) rotate(0deg)", opacity:1},
        {transform:"translate("+Math.cos(ang)*dist+"px,"+(Math.sin(ang)*dist+90)+"px) scale(1.1) rotate("+(Math.random()*540-270)+"deg)", opacity:0}
      ], {duration: 750 + Math.random()*450, easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish = () => b.remove();
    }
  }
  function centerOf(el){
    const r = el.getBoundingClientRect();
    return {x:r.left + r.width/2, y:r.top + r.height/2};
  }

  /* ---------------- wallpaper splats ---------------- */
  document.querySelectorAll("[data-splats]").forEach(function(box){
    for(let i=0;i<14;i++){
      const s = document.createElement("span");
      const size = 40 + Math.random()*150;
      s.style.cssText = "width:"+size+"px;height:"+size+"px;background:"+PALETTE[i%PALETTE.length]+
        ";left:"+(Math.random()*100)+"%;top:"+(Math.random()*100)+"%;animation-delay:"+(-Math.random()*9)+"s;opacity:"+(0.25+Math.random()*0.4);
      box.appendChild(s);
    }
  });

  /* ---------------- forgiving taps ---------------- */
  /* Toddlers' fingers wobble mid-press, which makes browsers cancel the
     synthetic "click" event (it treats the wobble as a scroll gesture).
     pointerdown fires the instant contact happens and ignores movement. */
  function onTap(el, handler){
    el.addEventListener("pointerdown", function(e){
      if(e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();
      handler(e);
    }, {passive:false});
  }

  /* ---------------- navigation ---------------- */
  function go(id){
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
    tone({f: id==="home" ? 300 : 660, to: id==="home" ? 180 : 990, dur:.25, type:"square", vol:.2});
    if(typeof stopDrawTone === "function") stopDrawTone();
    if(id === "draw" && typeof fitCanvas === "function"){
      requestAnimationFrame(fitCanvas);
    }
    if(id === "train" && typeof layoutTrack === "function"){
      requestAnimationFrame(layoutTrack);
      startTrainLoop();
    } else if(typeof stopTrainLoop === "function"){
      stopTrainLoop();
    }
  }
  document.addEventListener("pointerdown", function(e){
    if(e.pointerType === "mouse" && e.button !== 0) return;
    const g = e.target.closest("[data-go]");
    if(g){ e.preventDefault(); go(g.dataset.go); return; }
    const l = e.target.closest("[data-lang]");
    if(l){ e.preventDefault(); setLang(l.dataset.lang); }
  }, {passive:false});

  /* ---------------- global tap feedback ---------------- */
  document.addEventListener("pointerdown", function(e){
    ac();
    burst(e.clientX, e.clientY, PALETTE, 8);
  }, {passive:true});

  /* ---------------- SHAPES ---------------- */
  const SHAPES = [
    {key:"circle",  c:"sh-circle",  col:"#FFD23F", f:523},
    {key:"square",  c:"sh-square",  col:"#22CFE0", f:587},
    {key:"triangle",c:"sh-tri",     col:"#8DC63F", f:659},
    {key:"star",    c:"sh-star",    col:"#F57D0D", f:698},
    {key:"heart",   c:"sh-heart",   col:"#FF4FA3", f:784},
    {key:"diamond", c:"sh-diamond", col:"#7A3FBF", f:880}
  ];
  const shapeGrid = $("#shapeGrid"), shapeWord = $("#shapeWord"), bigShape = $("#bigShape");
  const shapeBtns = [];
  SHAPES.forEach(function(s){
    const b = document.createElement("button");
    b.className = "pad";
    b.style.background = s.col;
    b.innerHTML = '<span class="shape '+s.c+'"></span>';
    onTap(b, function(){
      const name = t().shapeNames[s.key];
      b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
      shapeWord.textContent = name + "!";
      shapeWord.classList.remove("flash"); void shapeWord.offsetWidth; shapeWord.classList.add("flash");
      tone({f:s.f, dur:.22, type:"triangle"});
      tone({f:s.f*1.5, at:.16, dur:.3, type:"sine", vol:.2});
      say(name);
      const p = centerOf(b); burst(p.x, p.y, [s.col, "#fff", "#241A2E"], 16);
      bigShape.className = "";
      bigShape.style.background = s.col;
      applyShape(bigShape, s.c);
      void bigShape.offsetWidth;
      bigShape.className = "go";
    });
    shapeGrid.appendChild(b);
    shapeBtns.push({btn:b, key:s.key});
  });
  function applyShape(el, cls){
    const map = {
      "sh-circle": {borderRadius:"50%", clipPath:"none"},
      "sh-square": {borderRadius:"14px", clipPath:"none"},
      "sh-tri":    {borderRadius:"0", clipPath:"polygon(50% 2%,100% 100%,0 100%)"},
      "sh-star":   {borderRadius:"0", clipPath:"polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)"},
      "sh-heart":  {borderRadius:"0", clipPath:'path("M50 90 C 10 60, 0 30, 22 14 C 36 4, 50 14, 50 26 C 50 14, 64 4, 78 14 C 100 30, 90 60, 50 90 Z")'},
      "sh-diamond":{borderRadius:"0", clipPath:"polygon(50% 0,100% 50%,50% 100%,0 50%)"}
    }[cls];
    el.style.borderRadius = map.borderRadius;
    el.style.clipPath = map.clipPath;
  }

  /* ---------------- COLORS ---------------- */
  const COLORS = [
    {key:"red",    c:"#EF3E36", f:392},
    {key:"orange", c:"#F57D0D", f:440},
    {key:"yellow", c:"#FFD23F", f:494},
    {key:"green",  c:"#8DC63F", f:523},
    {key:"blue",   c:"#2D7DD2", f:587},
    {key:"purple", c:"#7A3FBF", f:659},
    {key:"pink",   c:"#FF4FA3", f:698},
    {key:"brown",  c:"#8B5A2B", f:330}
  ];
  const colorGrid = $("#colorGrid"), colorWord = $("#colorWord"), colorScreen = $("#colors");
  const colorBtns = [];
  COLORS.forEach(function(c){
    const b = document.createElement("button");
    b.className = "pad swatch";
    b.style.background = c.c;
    onTap(b, function(){
      const name = t().colorNames[c.key];
      b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
      colorScreen.style.background = c.c;
      colorWord.textContent = name + "!";
      colorWord.style.background = "#241A2E";
      colorWord.style.color = c.c;
      colorWord.classList.remove("flash"); void colorWord.offsetWidth; colorWord.classList.add("flash");
      tone({f:c.f, to:c.f*2, dur:.35, type:"sine"});
      say(name);
      const p = centerOf(b); burst(p.x, p.y, [c.c, "#fff"], 20);
    });
    colorGrid.appendChild(b);
    colorBtns.push({btn:b, key:c.key});
  });

  /* ---------------- NUMBERS ---------------- */
  const numGrid = $("#numGrid"), numWord = $("#numWord"), tray = $("#tray");
  let countTimers = [];
  for(let i=1;i<=10;i++){
    const b = document.createElement("button");
    b.className = "pad";
    b.textContent = i;
    onTap(b, function(){
      b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
      countTimers.forEach(clearTimeout); countTimers = [];
      tray.innerHTML = "";
      numWord.textContent = i + " — " + t().numWords[i-1] + "!";
      numWord.classList.remove("flash"); void numWord.offsetWidth; numWord.classList.add("flash");
      say(String(i));
      for(let k=0;k<i;k++){
        countTimers.push(setTimeout(function(){
          const g = document.createElement("div");
          g.className = "goo";
          g.style.background = PALETTE[k % PALETTE.length];
          tray.appendChild(g);
          tone({f:330 + k*55, dur:.16, type:"triangle", vol:.22});
          const p = centerOf(g); burst(p.x, p.y, PALETTE, 5);
        }, k*260));
      }
      countTimers.push(setTimeout(function(){
        tone({f:880, to:1320, dur:.4, type:"sine", vol:.25});
        const r = tray.getBoundingClientRect();
        burst(r.left + r.width/2, r.top + r.height/2, PALETTE, 26);
      }, i*260 + 150));
    });
    numGrid.appendChild(b);
  }

  /* ---------------- SOUNDS ---------------- */
  const SOUNDS = [
    {key:"honk", e:"&#127894;", col:"#F57D0D", play(){
      tone({f:349, dur:.5, type:"sawtooth", vol:.22});
      tone({f:415, dur:.5, type:"sawtooth", vol:.18});
      tone({f:352, dur:.5, type:"sawtooth", vol:.1});
    }},
    {key:"drum", e:"&#129345;", col:"#7A3FBF", play(){
      tone({f:150, to:45, dur:.24, type:"sine", vol:.45});
      noise(.1, 0, 2600, .35);
      noise(.05, .12, 1800, .3);
    }},
    {key:"zap", e:"&#9889;", col:"#22CFE0", play(){
      tone({f:1700, to:220, dur:.32, type:"sawtooth", vol:.24});
      tone({f:2200, to:300, dur:.28, type:"square", vol:.1});
      noise(.06, .3, 2600, .2);
    }},
    {key:"cheer", e:"&#127881;", col:"#FFD23F", play(){
      [523,659,784,988,1175].forEach((f,i)=>tone({f:f, at:i*.07, dur:.24, type:"triangle", vol:.24}));
      noise(.5, 0, 2200, .14);
    }}
  ];
  const soundGrid = $("#soundGrid"), soundWord = $("#soundWord");
  SOUNDS.forEach(function(s){
    const b = document.createElement("button");
    b.className = "pad";
    b.style.background = s.col;
    b.innerHTML = s.e;
    onTap(b, function(){
      const name = t().soundNames[s.key];
      b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
      soundWord.textContent = name + "!";
      soundWord.classList.remove("flash"); void soundWord.offsetWidth; soundWord.classList.add("flash");
      s.play();
      const p = centerOf(b); burst(p.x, p.y, [s.col, "#fff", "#241A2E"], 18);
    });
    soundGrid.appendChild(b);
  });

  /* ---------------- LETTERS ---------------- */
  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const letterGrid = $("#letterGrid"), letterWord = $("#letterWord"), bigLetter = $("#bigLetter");
  LETTERS.forEach(function(ch, i){
    const b = document.createElement("button");
    b.className = "pad";
    b.style.background = PALETTE[i % PALETTE.length];
    b.textContent = ch;
    b.setAttribute("aria-label", ch);
    onTap(b, function(){
      b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
      letterWord.textContent = ch + "!";
      letterWord.classList.remove("flash"); void letterWord.offsetWidth; letterWord.classList.add("flash");
      const f = 260 + i * 22;
      tone({f:f, dur:.22, type:"triangle"});
      tone({f:f * 1.5, at:.14, dur:.28, type:"sine", vol:.18});
      say(ch);
      const p = centerOf(b); burst(p.x, p.y, [b.style.background, "#fff", "#241A2E"], 14);
      bigLetter.style.color = b.style.background;
      bigLetter.textContent = ch;
      bigLetter.className = "";
      void bigLetter.offsetWidth;
      bigLetter.className = "go";
    });
    letterGrid.appendChild(b);
  });

  /* ---------------- DRAW ---------------- */
  const drawCanvas = $("#drawCanvas"), swatchRow = $("#swatchRow");
  const dctx = drawCanvas.getContext("2d");
  const DRAW_COLORS = ["#241A2E","#EF3E36","#F57D0D","#FFD23F","#8DC63F","#22CFE0","#2D7DD2","#7A3FBF","#FF4FA3"];
  let drawColor = DRAW_COLORS[0];
  let isErasing = false;
  const eraserBtn = document.createElement("button");
  function deselectSwatches(){
    swatchRow.querySelectorAll(".swatchBtn, .eraserBtn").forEach(x => x.classList.remove("selected"));
  }
  DRAW_COLORS.forEach(function(col, i){
    const b = document.createElement("button");
    b.className = "swatchBtn" + (i === 0 ? " selected" : "");
    b.style.background = col;
    onTap(b, function(){
      drawColor = col;
      isErasing = false;
      deselectSwatches();
      b.classList.add("selected");
      tone({f:520, dur:.1, type:"sine", vol:.15});
    });
    swatchRow.appendChild(b);
  });
  eraserBtn.className = "eraserBtn";
  onTap(eraserBtn, function(){
    isErasing = true;
    deselectSwatches();
    eraserBtn.classList.add("selected");
    tone({f:300, to:220, dur:.12, type:"square", vol:.12});
  });
  swatchRow.appendChild(eraserBtn);
  function applyStrokeStyle(){
    if(isErasing){
      dctx.globalCompositeOperation = "destination-out";
      dctx.lineWidth = Math.max(24, drawCanvas.clientWidth * 0.075);
    } else {
      dctx.globalCompositeOperation = "source-over";
      dctx.strokeStyle = drawColor;
      dctx.lineWidth = Math.max(10, drawCanvas.clientWidth * 0.035);
    }
  }
  function fitCanvas(){
    const rect = drawCanvas.getBoundingClientRect();
    if(rect.width < 1 || rect.height < 1) return;
    const dpr = window.devicePixelRatio || 1;
    drawCanvas.width = Math.round(rect.width * dpr);
    drawCanvas.height = Math.round(rect.height * dpr);
    dctx.scale(dpr, dpr);
    dctx.lineCap = "round";
    dctx.lineJoin = "round";
  }
  function drawPos(e){
    const r = drawCanvas.getBoundingClientRect();
    return {x: e.clientX - r.left, y: e.clientY - r.top};
  }
  function yToFreq(y){
    const h = drawCanvas.clientHeight || 300;
    const frac = Math.max(0, Math.min(1, y / h));
    return 850 - frac * 550;
  }
  let drawOsc = null, drawGain = null;
  function startDrawTone(y){
    const a = ac(); if(!a || drawOsc) return;
    drawOsc = a.createOscillator();
    drawGain = a.createGain();
    drawOsc.type = "sine";
    drawGain.gain.value = 0.0001;
    drawOsc.connect(drawGain); drawGain.connect(a.destination);
    drawOsc.frequency.value = yToFreq(y);
    drawOsc.start();
    drawGain.gain.linearRampToValueAtTime(0.12, a.currentTime + 0.05);
  }
  function updateDrawTone(y){
    if(!drawOsc) return;
    drawOsc.frequency.linearRampToValueAtTime(yToFreq(y), ac().currentTime + 0.05);
  }
  function stopDrawTone(){
    if(!drawOsc) return;
    const a = ac();
    try{
      drawGain.gain.linearRampToValueAtTime(0.0001, a.currentTime + 0.08);
      drawOsc.stop(a.currentTime + 0.1);
    }catch(e){}
    drawOsc = null; drawGain = null;
  }
  const drawPointers = new Map();
  drawCanvas.addEventListener("pointerdown", function(e){
    e.preventDefault();
    drawCanvas.setPointerCapture(e.pointerId);
    const p = drawPos(e);
    drawPointers.set(e.pointerId, p);
    dctx.beginPath();
    applyStrokeStyle();
    dctx.moveTo(p.x, p.y);
    dctx.lineTo(p.x + 0.1, p.y + 0.1);
    dctx.stroke();
    startDrawTone(p.y);
  }, {passive:false});
  drawCanvas.addEventListener("pointermove", function(e){
    if(!drawPointers.has(e.pointerId)) return;
    e.preventDefault();
    const prev = drawPointers.get(e.pointerId);
    const p = drawPos(e);
    dctx.beginPath();
    applyStrokeStyle();
    dctx.moveTo(prev.x, prev.y);
    dctx.lineTo(p.x, p.y);
    dctx.stroke();
    drawPointers.set(e.pointerId, p);
    updateDrawTone(p.y);
  }, {passive:false});
  function endDrawStroke(e){
    drawPointers.delete(e.pointerId);
    if(drawPointers.size === 0) stopDrawTone();
  }
  drawCanvas.addEventListener("pointerup", endDrawStroke);
  drawCanvas.addEventListener("pointercancel", endDrawStroke);
  drawCanvas.addEventListener("pointerleave", endDrawStroke);
  onTap($("#clearDraw"), function(){
    dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    tone({f:700, to:200, dur:.3, type:"sawtooth", vol:.2});
    const r = drawCanvas.getBoundingClientRect();
    burst(r.left + r.width/2, r.top + r.height/2, PALETTE, 22);
  });

  /* ---------------- TRAIN ---------------- */
  const trainStage = $("#trainStage"), trackSvg = $("#trackSvg"), trainSprite = $("#trainSprite");
  const controlCard = $("#controlCard");
  const CAR_COLORS = ["#22CFE0", "#7A3FBF", "#FF4FA3"];
  const CAR_GAP = 6.5; // percent of track length between each car/engine
  const cars = CAR_COLORS.map(function(col){
    const el = document.createElement("div");
    el.className = "car";
    el.style.setProperty("--car-color", col);
    el.innerHTML = '<div class="car-body"></div><div class="wheel wa"></div><div class="wheel wb"></div><div class="wheel wc"></div><div class="wheel wd"></div>';
    trainStage.insertBefore(el, controlCard);
    return el;
  });
  let trainDistance = 0, trainDirection = 0, trainSpeed = 35;
  let trainRafId = null, trainLastTs = null, chuffAccum = 0;
  let railDashPath = null, railDashOffset = 0, trackLength = 0;
  function layoutTrack(){
    const w = trainStage.clientWidth, h = trainStage.clientHeight;
    if(w < 10 || h < 10) return;
    const inset = Math.max(50, Math.min(w, h) * 0.16);
    const x0 = inset, y0 = inset, x1 = w - inset, y1 = h - inset;
    const r = Math.min(60, (x1 - x0) / 2, (y1 - y0) / 2);
    const d = "M " + (x0+r) + " " + y0 + " L " + (x1-r) + " " + y0 + " Q " + x1 + " " + y0 + " " + x1 + " " + (y0+r) +
      " L " + x1 + " " + (y1-r) + " Q " + x1 + " " + y1 + " " + (x1-r) + " " + y1 +
      " L " + (x0+r) + " " + y1 + " Q " + x0 + " " + y1 + " " + x0 + " " + (y1-r) +
      " L " + x0 + " " + (y0+r) + " Q " + x0 + " " + y0 + " " + (x0+r) + " " + y0 + " Z";
    trackSvg.setAttribute("viewBox", "0 0 " + w + " " + h);
    trackSvg.innerHTML =
      '<path d="' + d + '" fill="none" stroke="#241A2E" stroke-width="16" stroke-linecap="round"/>' +
      '<path class="railDash" d="' + d + '" fill="none" stroke="#FFF3D6" stroke-width="4" stroke-dasharray="14 14"/>';
    railDashPath = trackSvg.querySelector(".railDash");
    trackLength = railDashPath.getTotalLength();
    trainSprite.style.offsetPath = "path('" + d + "')";
    trainSprite.style.offsetRotate = "auto";
    cars.forEach(function(car){
      car.style.offsetPath = "path('" + d + "')";
      car.style.offsetRotate = "auto";
    });
    updateTrainPosition();
    // fit the control card inside the loop so it never overlaps the rails
    const innerW = Math.max(150, (x1 - x0) - 44);
    const innerH = Math.max(120, (y1 - y0) - 44);
    controlCard.style.width = Math.min(innerW, 320) + "px";
    controlCard.style.maxHeight = innerH + "px";
  }
  function updateTrainPosition(){
    trainSprite.style.offsetDistance = trainDistance + "%";
    trainSprite.style.transform = "translate(-50%,-50%)";
    cars.forEach(function(car, i){
      const dist = (trainDistance - CAR_GAP * (i + 1) + 300) % 100;
      car.style.offsetDistance = dist + "%";
      car.style.transform = "translate(-50%,-50%)";
    });
  }
  function setWheelSpeed(){
    const dur = trainDirection === 0 ? "0.6s" : (0.75 - (trainSpeed / 100) * 0.55) + "s";
    const dir = trainDirection < 0 ? "reverse" : "normal";
    document.querySelectorAll("#trainStage .wheel").forEach(function(w){
      w.style.animationDuration = dur;
      w.style.animationDirection = dir;
    });
  }
  function trainStep(ts){
    if(trainLastTs == null) trainLastTs = ts;
    const dt = (ts - trainLastTs) / 1000;
    trainLastTs = ts;
    if(trainDirection !== 0){
      const rate = 2 + (trainSpeed / 100) * 16;
      trainDistance = (trainDistance + trainDirection * rate * dt + 100) % 100;
      updateTrainPosition();
      if(railDashPath && trackLength){
        railDashOffset -= trainDirection * (rate / 100) * trackLength * dt;
        railDashPath.style.strokeDashoffset = railDashOffset;
      }
      chuffAccum += dt;
      const chuffEvery = 0.55 - (trainSpeed / 100) * 0.4;
      if(chuffAccum >= chuffEvery){
        chuffAccum = 0;
        noise(.08, 0, 500);
        tone({f:90, dur:.08, type:"sine", vol:.15});
        const stack = trainSprite.querySelector(".loco-stack");
        if(stack){
          const r = stack.getBoundingClientRect();
          burst(r.left + r.width/2, r.top + r.height/2, ["#fff","#e6e6e6","#cfcfcf","#b8b8b8"], 4);
        }
      }
    }
    trainRafId = requestAnimationFrame(trainStep);
  }
  function startTrainLoop(){
    if(trainRafId != null) return;
    trainLastTs = null;
    trainRafId = requestAnimationFrame(trainStep);
  }
  function stopTrainLoop(){
    if(trainRafId != null){ cancelAnimationFrame(trainRafId); trainRafId = null; }
  }
  function setTrainDirection(dir){
    trainDirection = dir;
    const running = dir !== 0;
    trainSprite.classList.toggle("running", running);
    cars.forEach(function(car){ car.classList.toggle("running", running); });
    setWheelSpeed();
    updateTrainPosition();
    if(dir !== 0) tone({f:340, to:520, dur:.18, type:"triangle", vol:.18});
  }
  onTap($("#btnFwd"), function(){ setTrainDirection(1); });
  onTap($("#btnStop"), function(){ setTrainDirection(0); tone({f:260, to:120, dur:.2, type:"square", vol:.2}); });
  onTap($("#btnBack"), function(){ setTrainDirection(-1); });
  onTap($("#btnWhistle"), function(){
    tone({f:349, dur:.6, type:"sawtooth", vol:.22});
    tone({f:415, dur:.6, type:"sawtooth", vol:.18});
    tone({f:349, at:.65, dur:.5, type:"sawtooth", vol:.22});
    tone({f:415, at:.65, dur:.5, type:"sawtooth", vol:.18});
    const stack = trainSprite.querySelector(".loco-stack");
    const r = (stack || trainSprite).getBoundingClientRect();
    burst(r.left + r.width/2, r.top, ["#fff","#e8e8e8","#cfcfcf"], 22);
  });
  const speedSlider = $("#speedSlider");
  trainSpeed = parseInt(speedSlider.value, 10);
  speedSlider.addEventListener("input", function(){
    trainSpeed = parseInt(speedSlider.value, 10);
    setWheelSpeed();
  });
  window.addEventListener("resize", function(){
    if($("#train").classList.contains("on")) layoutTrack();
    if($("#draw").classList.contains("on")) fitCanvas();
  });

  /* ---------------- language ---------------- */
  function applyLang(){
    const d = t();
    document.documentElement.lang = lang;
    document.title = d.docTitle;
    document.querySelectorAll("[data-tagline]").forEach(el => el.textContent = d.tagline);
    document.querySelectorAll("[data-home]").forEach(el => el.textContent = d.home);
    document.querySelectorAll("[data-title]").forEach(el => el.textContent = d.titles[el.dataset.title]);
    document.querySelectorAll("[data-tile]").forEach(el => el.textContent = d.tiles[el.dataset.tile]);
    shapeWord.textContent = d.hints.shape;
    colorWord.textContent = d.hints.color;
    numWord.textContent = d.hints.number;
    soundWord.textContent = d.hints.sound;
    letterWord.textContent = d.hints.letter;
    document.querySelectorAll("[data-clear]").forEach(el => el.textContent = d.clearLabel);
    document.querySelectorAll("[data-ctrl]").forEach(el => el.textContent = d.ctrl[el.dataset.ctrl]);
    shapeBtns.forEach(o => o.btn.setAttribute("aria-label", d.shapeNames[o.key]));
    colorBtns.forEach(o => o.btn.setAttribute("aria-label", d.colorNames[o.key]));
    document.querySelectorAll(".langSwitch button").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.lang === lang);
    });
  }
  function setLang(next){
    if(next !== "en" && next !== "de") return;
    lang = next;
    localStorage.setItem("slimeLang", lang);
    applyLang();
    tone({f:520, to:780, dur:.15, type:"triangle", vol:.2});
  }
  applyLang();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("/sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
