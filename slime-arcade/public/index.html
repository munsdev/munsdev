<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Henry's Arcade</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F57D0D">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Henry's Arcade">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@600;800&display=swap">
<style>
  :root{
    --slime:#8DC63F;
    --slime-dark:#5E9017;
    --orange:#F57D0D;
    --pink:#FF4FA3;
    --cyan:#22CFE0;
    --purple:#7A3FBF;
    --sun:#FFD23F;
    --ink:#241A2E;
    --cream:#FFF3D6;
    --display:"Bungee","Baloo 2",system-ui,sans-serif;
    --round:"Baloo 2","Bungee",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--orange);
    color:var(--ink);
    font-family:var(--round);
    overflow:hidden;
    touch-action:manipulation;
    user-select:none;
  }

  /* ---------- app frame ---------- */
  #app{position:fixed;inset:0;overflow:hidden}
  .screen{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;
    padding:clamp(10px,2.2vmin,22px);
    gap:clamp(8px,1.6vmin,18px);
    overflow:hidden;
  }
  .screen.on{display:flex}

  /* splatter wallpaper */
  .splats{position:absolute;inset:0;pointer-events:none;opacity:.5}
  .splats span{
    position:absolute;display:block;
    border-radius:60% 40% 55% 45%/50% 60% 40% 50%;
    animation:drift 9s ease-in-out infinite;
  }
  @keyframes drift{0%,100%{transform:translate3d(0,0,0) rotate(0deg)}50%{transform:translate3d(0,-14px,0) rotate(9deg)}}

  /* ---------- language switch ---------- */
  .langSwitch{
    position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:60;
    display:flex;gap:6px;background:rgba(36,26,46,.55);
    padding:5px;border-radius:16px;
  }
  .langSwitch button{
    font-family:var(--round);font-weight:800;font-size:14px;
    border:3px solid var(--ink);border-radius:11px;
    padding:.35em .7em;background:#fff;color:var(--ink);
    cursor:pointer;min-width:2.6em;
    transition:transform .08s;
  }
  .langSwitch button.active{background:var(--slime);color:#fff;box-shadow:0 3px 0 var(--ink)}
  .langSwitch button:active{transform:translateY(2px)}

  /* ---------- parent mode ---------- */
  .parentLock{
    position:fixed;bottom:max(10px,env(safe-area-inset-bottom));right:10px;z-index:60;
    width:34px;height:34px;border-radius:50%;
    background:rgba(36,26,46,.55);border:none;color:#fff;font-size:16px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .parentPie{
    position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;z-index:60;
    width:26px;height:26px;border-radius:50%;
    border:3px solid var(--ink);
    background:conic-gradient(var(--slime) 0% 100%, var(--slime) 100%);
    display:none;
  }
  .parentPie.show{display:block}
  .parentFade{
    position:fixed;inset:0;z-index:70;background:#000;opacity:0;pointer-events:none;
  }
  .parentModal{
    position:fixed;inset:0;z-index:80;
    background:rgba(20,14,26,.72);
    display:none;align-items:center;justify-content:center;
    padding:20px;
  }
  .parentModal.on{display:flex}
  .parentCard{
    position:relative;
    background:var(--cream);border:6px solid var(--ink);border-radius:26px;
    box-shadow:0 12px 0 var(--ink);
    padding:26px 22px 22px;
    width:min(90vw,340px);
    display:flex;flex-direction:column;gap:14px;
    align-items:stretch;
  }
  .parentCard h2{
    font-family:var(--display);font-size:clamp(18px,5vw,26px);text-align:center;color:var(--ink);
  }
  .parentClose{
    position:absolute;top:-14px;right:-14px;width:34px;height:34px;border-radius:50%;
    background:#EF3E36;color:#fff;border:4px solid var(--ink);font-size:14px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .chipRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{
    font-family:var(--round);font-weight:800;font-size:clamp(14px,3.6vw,18px);
    background:var(--cyan);color:#fff;border:4px solid var(--ink);border-radius:20px;
    padding:.4em .9em;cursor:pointer;
  }
  .chip.selected{background:var(--sun);color:var(--ink);box-shadow:0 0 0 3px var(--ink) inset}
  .parentStart, .parentStop{
    font-family:var(--display);font-size:clamp(15px,4vw,20px);
    border:5px solid var(--ink);border-radius:18px;
    padding:.5em .6em;box-shadow:0 6px 0 var(--ink);cursor:pointer;color:#fff;
    transition:transform .08s;
  }
  .parentStart{background:var(--slime)}
  .parentStop{background:#EF3E36;display:none}
  .parentStop.show{display:block}
  .parentStart:active, .parentStop:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:12px;position:relative;z-index:3;flex:0 0 auto}
  .back{
    font-family:var(--display);
    font-size:clamp(18px,3.4vmin,30px);
    color:#fff;background:var(--slime);
    border:5px solid var(--ink);
    border-radius:22px;
    padding:.45em .8em;
    box-shadow:0 7px 0 var(--ink);
    cursor:pointer;
    transition:transform .08s;
    white-space:nowrap;
  }
  .back:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
  .title{
    flex:1 1 auto;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-family:var(--display);
    color:#fff;
    font-size:clamp(20px,4.6vmin,44px);
    letter-spacing:.02em;
    text-shadow:3px 3px 0 var(--ink);
    transform:rotate(-2deg);
    padding-left:.15em;
  }

  /* ---------- home ---------- */
  .logo{
    text-align:center;position:relative;z-index:3;flex:0 0 auto;
    padding-top:clamp(4px,1.5vmin,18px);
  }
  .logo .blob{
    display:inline-block;background:var(--slime);
    border:6px solid var(--ink);
    border-radius:46% 54% 40% 60%/58% 42% 60% 42%;
    padding:.35em .9em .45em;
    box-shadow:0 10px 0 var(--ink);
    transform:rotate(-3deg);
    animation:bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(2deg) translateY(-10px)}}
  .logo h1{
    font-family:var(--display);
    font-size:clamp(30px,8vmin,78px);
    color:#fff;
    text-shadow:5px 5px 0 var(--ink);
    line-height:1;
  }
  .logo p{
    font-family:var(--round);font-weight:800;
    color:#fff;font-size:clamp(13px,2.4vmin,22px);
    text-shadow:2px 2px 0 var(--ink);
    margin-top:.35em;
  }

  .menu{
    flex:1 1 auto;position:relative;z-index:3;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-auto-rows:minmax(96px,1fr);
    gap:clamp(6px,1.3vmin,14px);
    padding:clamp(6px,1.5vmin,16px) 0 clamp(2px,1vmin,10px);
    min-height:0;
    overflow-y:auto;
  }
  .tile{
    border:8px solid var(--ink);
    border-radius:38px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.15em;
    cursor:pointer;
    box-shadow:0 12px 0 var(--ink);
    font-family:var(--display);
    color:#fff;
    font-size:clamp(14px,3vmin,30px);
    text-shadow:3px 3px 0 rgba(0,0,0,.35);
    transition:transform .1s;
    min-height:0;
  }
  .tile .ico{font-size:clamp(32px,10vmin,78px);line-height:1;margin-bottom:.08em;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.3))}
  .tile:active{transform:translateY(10px) scale(.97);box-shadow:0 2px 0 var(--ink)}
  .tile.t1{background:var(--pink);transform:rotate(-2deg)}
  .tile.t2{background:var(--cyan);transform:rotate(2deg)}
  .tile.t3{background:var(--purple);transform:rotate(1.5deg)}
  .tile.t4{background:var(--sun);color:var(--ink);text-shadow:3px 3px 0 rgba(255,255,255,.5);transform:rotate(-1.5deg)}
  .tile.t5{background:var(--slime);transform:rotate(-1.5deg)}
  .tile.t6{background:#EF3E36;transform:rotate(2deg)}
  .tile.t7{background:#8B5A2B;transform:rotate(-1deg)}
  .tile.t7{grid-column:1 / -1}
  .tile.t1:active,.tile.t2:active,.tile.t3:active,.tile.t4:active,.tile.t5:active,.tile.t6:active,.tile.t7:active{transform:translateY(10px) scale(.97)}

  /* ---------- shared play area ---------- */
  .stage{
    flex:1 1 auto;position:relative;z-index:3;min-height:0;
    background:rgba(255,255,255,.22);
    border:6px solid var(--ink);
    border-radius:34px;
    padding:clamp(8px,1.8vmin,20px);
    display:flex;flex-direction:column;gap:clamp(8px,1.6vmin,16px);
    overflow:hidden;
  }
  .pad-grid{
    flex:1 1 auto;display:grid;gap:clamp(4px,1vmin,10px);min-height:0;
  }
  .pad{
    border:7px solid var(--ink);
    border-radius:28px;
    box-shadow:0 9px 0 var(--ink);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);
    color:#fff;
    transition:transform .09s;
    min-height:0;position:relative;overflow:hidden;
  }
  .pad:active{transform:translateY(8px) scale(.96);box-shadow:0 1px 0 var(--ink)}
  .pad.pop{animation:pop .5s ease-out}
  @keyframes pop{
    0%{transform:scale(1); box-shadow:0 9px 0 var(--ink), 0 0 0 0 rgba(255,255,255,.85)}
    35%{transform:scale(1.16) rotate(-4deg); box-shadow:0 9px 0 var(--ink), 0 0 0 9px rgba(255,255,255,.45)}
    70%{transform:scale(.94) rotate(3deg); box-shadow:0 9px 0 var(--ink), 0 0 0 15px rgba(255,255,255,0)}
    100%{transform:scale(1); box-shadow:0 9px 0 var(--ink), 0 0 0 15px rgba(255,255,255,0)}
  }

  /* readout bar */
  .readout{
    flex:0 0 auto;
    background:var(--ink);color:var(--cream);
    border-radius:20px;
    font-family:var(--display);
    font-size:clamp(16px,3.6vmin,34px);
    text-align:center;
    padding:.3em .4em;
    letter-spacing:.03em;
    min-height:1.6em;
  }
  .readout.flash{animation:flash .4s}
  @keyframes flash{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

  /* ---------- shapes ---------- */
  #shapes .pad-grid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
  .shape{width:min(70%,26vmin);aspect-ratio:1;background:#fff;box-shadow:0 0 0 5px var(--ink) inset}
  .sh-circle{border-radius:50%}
  .sh-square{border-radius:8px}
  .sh-tri{clip-path:polygon(50% 2%,100% 100%,0 100%);box-shadow:none;border:none;background:#fff}
  .sh-star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);box-shadow:none}
  .sh-heart{clip-path:path("M50 90 C 10 60, 0 30, 22 14 C 36 4, 50 14, 50 26 C 50 14, 64 4, 78 14 C 100 30, 90 60, 50 90 Z");box-shadow:none;width:min(76%,28vmin)}
  .sh-diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:none}

  /* giant celebration shape */
  #bigShape{
    position:absolute;inset:0;margin:auto;
    width:min(46vmin,300px);height:min(46vmin,300px);
    pointer-events:none;opacity:0;z-index:5;
  }
  #bigShape.go{animation:bigpop 1s ease-out}
  @keyframes bigpop{
    0%{opacity:0;transform:scale(.2) rotate(-25deg)}
    30%{opacity:1;transform:scale(1.1) rotate(8deg)}
    70%{opacity:1;transform:scale(1) rotate(-4deg)}
    100%{opacity:0;transform:scale(1.35) rotate(10deg)}
  }

  /* ---------- colors ---------- */
  #colors .pad-grid{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}
  .swatch{border-radius:50% 42% 58% 45%/48% 55% 45% 52%}

  /* ---------- numbers ---------- */
  #numbers .pad-grid{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);flex:0 0 auto;height:41%}
  #numbers .pad{font-size:clamp(20px,5.5vmin,50px);background:var(--purple)}
  #numbers .pad:nth-child(even){background:var(--pink)}
  .tray{
    flex:1 1 auto;min-height:0;
    background:rgba(255,255,255,.6);
    border:6px dashed var(--ink);
    border-radius:26px;
    display:flex;flex-wrap:wrap;align-content:center;justify-content:center;
    gap:clamp(4px,1.4vmin,14px);
    padding:clamp(6px,1.4vmin,14px);
    overflow:hidden;
  }
  .goo{
    width:clamp(26px,7vmin,64px);aspect-ratio:1;
    background:var(--slime);
    border:4px solid var(--ink);
    border-radius:52% 48% 44% 56%/56% 44% 56% 44%;
    animation:drop .5s cubic-bezier(.2,1.6,.5,1) both, wob 1.8s ease-in-out infinite .5s;
  }
  @keyframes drop{from{transform:translateY(-120px) scale(.3);opacity:0}to{transform:none;opacity:1}}
  @keyframes wob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(5deg)}}

  /* ---------- sounds ---------- */
  #sounds .pad-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
  #sounds .pad{font-size:clamp(56px,18vmin,130px);text-shadow:none}

  /* ---------- letters ---------- */
  #letters .pad-grid{
    grid-template-columns:repeat(4,1fr);
    grid-auto-rows:minmax(64px,1fr);
    overflow-y:auto;
  }
  #letters .pad{font-size:clamp(24px,6.5vmin,52px)}
  #bigLetter{
    position:absolute;inset:0;margin:auto;
    width:min(60vmin,340px);height:min(60vmin,340px);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);
    font-size:min(40vmin,220px);
    color:#fff;
    text-shadow:6px 6px 0 var(--ink);
    pointer-events:none;opacity:0;z-index:5;
  }
  #bigLetter.go{animation:bigpop 1s ease-out}

  /* ---------- draw ---------- */
  .swatchRow{
    flex:0 0 auto;display:flex;justify-content:center;
    gap:clamp(6px,1.6vmin,14px);flex-wrap:wrap;
  }
  .swatchBtn{
    width:clamp(30px,8vmin,52px);aspect-ratio:1;
    border:4px solid var(--ink);border-radius:50%;
    box-shadow:0 4px 0 var(--ink);
    cursor:pointer;transition:transform .08s;
  }
  .swatchBtn.selected{transform:scale(1.22);box-shadow:0 0 0 4px #fff, 0 0 0 8px var(--ink)}
  .swatchBtn:active{transform:scale(.92)}
  .eraserBtn{
    width:clamp(34px,9vmin,58px);height:clamp(30px,8vmin,52px);
    border:4px solid var(--ink);border-radius:10px;
    background:linear-gradient(90deg,#fff 0 55%,#FF9FCB 55% 100%);
    box-shadow:0 4px 0 var(--ink);
    cursor:pointer;transition:transform .08s;
    position:relative;
  }
  .eraserBtn::after{
    content:"";position:absolute;left:52%;top:15%;bottom:15%;width:2px;
    background:var(--ink);opacity:.5;
  }
  .eraserBtn.selected{transform:scale(1.18);box-shadow:0 0 0 4px #fff, 0 0 0 8px var(--ink)}
  .eraserBtn:active{transform:scale(.92)}
  .toolRow{flex:0 0 auto;display:flex;gap:clamp(6px,1.6vmin,14px)}
  .clearBtn, .saveBtn{
    flex:1 1 0;
    font-family:var(--display);
    font-size:clamp(13px,2.6vmin,19px);
    color:#fff;
    border:5px solid var(--ink);border-radius:18px;
    padding:.4em .55em;
    box-shadow:0 6px 0 var(--ink);
    cursor:pointer;white-space:nowrap;
    transition:transform .08s;
  }
  .clearBtn{background:var(--pink)}
  .saveBtn{background:var(--sun);color:var(--ink)}
  .clearBtn:active, .saveBtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
  #drawCanvas{
    flex:1 1 auto;width:100%;min-height:0;
    background:#fff;
    border:6px solid var(--ink);border-radius:26px;
    touch-action:none;display:block;
  }

  /* ---------- train ---------- */
  .trainStage{
    flex:1 1 auto;position:relative;z-index:3;min-height:0;
    border-radius:34px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.06);
  }
  .trainStage svg.track{position:absolute;inset:0;width:100%;height:100%}
  /* Every vehicle is one flat side-view "paper cutout" drawing that stays
     tangent to the rail and simply turns a full 360 degrees around the
     loop -- no swapped poses, no flip. Placement (translate/rotate/scale)
     is computed by hand in JS from two axle points rather than handed to
     CSS offset-path, because a rigid drawing has to chord across a curve
     like a real wagon (pivoting on a single point lifts its end wheels off
     the rail), and because scaling has to happen around the same point the
     path anchors or the wheels drift off-line. */
  .vehicle{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  .vehicle .art{position:relative;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15)) drop-shadow(0 7px 9px rgba(0,0,0,.22))}
  .vpart{position:absolute}

  .w{border-radius:50%;background:#191920;border:3px solid var(--brass,#C9A24A);overflow:hidden;position:absolute}
  .w::after{content:"";position:absolute;left:50%;top:50%;width:26%;height:26%;
    transform:translate(-50%,-50%);background:var(--brass,#C9A24A);border-radius:50%;z-index:2}
  .wspin{position:absolute;inset:0;animation:wheelSpin .9s linear infinite;animation-play-state:paused}
  .wspin i{position:absolute;left:50%;top:8%;width:2px;height:84%;background:#4A4A56;transform:translateX(-50%)}
  .wspin i.b{transform:translateX(-50%) rotate(60deg)}
  .wspin i.c{transform:translateX(-50%) rotate(120deg)}
  @keyframes wheelSpin{to{transform:rotate(360deg)}}
  .running .wspin{animation-play-state:running}

  /* locomotive (240x150 art units, wheel baseline at y=126) */
  .l-frame{left:26px;top:96px;width:190px;height:11px;background:#2A2A31;border-radius:2px}
  .l-frame2{left:30px;top:105px;width:180px;height:5px;background:#17171B}
  .l-cab{left:30px;top:38px;width:62px;height:58px;background:#8E2420;border-radius:5px 3px 0 0}
  .l-cab-roof{left:22px;top:28px;width:80px;height:12px;background:#6E1B18;border-radius:4px}
  .l-cab-roof2{left:22px;top:26px;width:80px;height:5px;background:#A63A32;border-radius:4px 4px 0 0}
  .l-cab-win{left:44px;top:50px;width:30px;height:26px;background:#BFE9FF;border:3px solid #17171B;border-radius:3px}
  .l-boiler{left:88px;top:56px;width:112px;height:44px;background:#22222A;border-radius:4px 20px 20px 4px/4px 22px 22px 4px}
  .l-boiler-hi{left:92px;top:60px;width:104px;height:7px;background:#3C3C46;border-radius:4px}
  .l-band1{left:118px;top:56px;width:7px;height:44px;background:#C9A24A}
  .l-band2{left:152px;top:56px;width:7px;height:44px;background:#C9A24A}
  .l-smokebox{left:186px;top:54px;width:20px;height:48px;background:#2E2E38;border-radius:6px 12px 12px 6px}
  .l-smokebox-ring{left:196px;top:60px;width:9px;height:36px;background:#4A4A56;border-radius:0 8px 8px 0}
  .l-dome{left:124px;top:40px;width:22px;height:18px;background:#22222A;border-radius:11px 11px 2px 2px}
  .l-dome-cap{left:122px;top:37px;width:26px;height:7px;background:#C9A24A;border-radius:4px}
  .l-sand{left:156px;top:44px;width:17px;height:14px;background:#22222A;border-radius:9px 9px 2px 2px}
  .l-stack{left:176px;top:22px;width:18px;height:36px;background:#22222A}
  .l-stack-flare{left:170px;top:14px;width:30px;height:13px;background:#2E2E38;border-radius:5px}
  .l-stack-lip{left:170px;top:12px;width:30px;height:5px;background:#4A4A56;border-radius:4px}
  .l-lamp-bracket{left:198px;top:50px;width:8px;height:10px;background:#2A2A31}
  .l-lamp{left:192px;top:34px;width:20px;height:18px;background:#F0C03A;border:3px solid #17171B;border-radius:3px}
  .l-beam{left:204px;top:88px;width:12px;height:22px;background:#8E2420;border-radius:2px}
  .l-catcher{left:206px;top:96px;width:32px;height:30px;background:#2A2A31;clip-path:polygon(0 0, 100% 62%, 100% 100%, 0 100%)}
  .l-rod{left:70px;top:112px;width:98px;height:5px;background:#C9A24A;border-radius:3px}
  .l-d1{left:56px;top:90px;width:36px;height:36px}
  .l-d2{left:100px;top:90px;width:36px;height:36px}

  /* tender (128x150) */

  /* coach (150x150) */
  .c-frame{left:8px;top:96px;width:134px;height:11px;background:#2A2A31;border-radius:2px}
  .c-body{left:12px;top:46px;width:126px;height:52px;background:var(--car,#2E7DB8);border-radius:4px}

  .c-door{left:70px;top:54px;width:12px;height:42px;background:rgba(0,0,0,.18);border-radius:2px}

  .c-wh2{left:100px;top:104px;width:22px;height:22px}

  .puff{position:absolute;border-radius:50%;background:#EFE9DC;pointer-events:none;z-index:6}

  .controlCard{
    position:relative;z-index:4;
    width:min(84vw,320px);max-width:100%;
    background:rgba(255,255,255,.85);
    border:6px solid var(--ink);border-radius:28px;
    box-shadow:0 10px 0 var(--ink);
    padding:clamp(10px,2.4vw,16px);
    display:flex;gap:clamp(8px,1.8vw,14px);
    box-sizing:border-box;
    overflow:hidden;
  }
  /* Vertical throttle: a real horizontal <input type=range> rotated 90deg
     inside a swapped-dimension wrapper. This reads instantly as "push up
     for faster" and gives the slider far more usable travel than a thin
     strip ever could, using the same touch target every browser already
     knows how to render. */
  .throttleWrap{
    flex:0 0 auto;position:relative;
    width:clamp(48px,13vw,64px);height:100%;min-height:150px;
  }
  .throttleWrap input[type="range"]{
    position:absolute;left:50%;top:50%;
    width:var(--tlen,170px);height:clamp(30px,8vw,42px);
    transform:translate(-50%,-50%) rotate(-90deg);
    -webkit-appearance:none;appearance:none;
    margin:0;border-radius:14px;
    background:var(--purple);border:4px solid var(--ink);
  }
  .throttleWrap input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:clamp(40px,10vw,54px);height:clamp(40px,10vw,54px);
    border-radius:50%;background:var(--sun);
    border:5px solid var(--ink);cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.3);
  }
  .throttleWrap input[type="range"]::-moz-range-thumb{
    width:clamp(40px,10vw,54px);height:clamp(40px,10vw,54px);
    border-radius:50%;background:var(--sun);
    border:5px solid var(--ink);cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.3);
  }
  .throttleWrap .temo{
    position:absolute;left:50%;transform:translateX(-50%);
    font-size:clamp(18px,5vw,26px);pointer-events:none;
  }
  .throttleWrap .temo.hi{top:2px}
  .throttleWrap .temo.lo{bottom:2px}
  .ctrlCol{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:clamp(6px,1.6vw,10px)}
  .ctrlBtn{
    display:flex;flex-direction:row;align-items:center;justify-content:center;gap:.35em;
    font-family:var(--round);font-weight:800;
    font-size:clamp(13px,3.4vw,18px);
    color:#fff;
    border:5px solid var(--ink);border-radius:18px;
    box-shadow:0 6px 0 var(--ink);
    padding:.5em .3em;
    cursor:pointer;transition:transform .08s;
    flex:1 1 0;
  }
  .ctrlBtn .glyph{font-size:clamp(20px,5.6vw,30px);line-height:1}
  .ctrlBtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
  .ctrlBtn.fwd{background:var(--slime)}
  .ctrlBtn.stop{background:#EF3E36}
  .ctrlBtn.back{background:var(--cyan)}
  .whistleBtn{
    display:flex;align-items:center;justify-content:center;gap:.3em;
    font-family:var(--display);
    font-size:clamp(13px,3.4vw,18px);
    color:var(--ink);background:var(--sun);
    border:5px solid var(--ink);border-radius:18px;
    padding:.5em .4em;
    box-shadow:0 6px 0 var(--ink);
    cursor:pointer;transition:transform .08s;
    flex:1 1 0;
  }
  .whistleBtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}

  /* ---------- particles ---------- */
  .bit{position:fixed;pointer-events:none;z-index:99;border-radius:50% 45% 55% 42%/50% 55% 45% 50%;border:3px solid var(--ink)}

  @media (max-width:520px){
    .tile{border-radius:28px}
    .stage{border-radius:26px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
  }
  :focus-visible{outline:5px solid #fff;outline-offset:3px}
</style>
</head>
<body>

<script>
(function(){
  "use strict";
  const PALETTE = ["#8DC63F","#F57D0D","#FF4FA3","#22CFE0","#7A3FBF","#FFD23F"];
  const $ = s => document.querySelector(s);
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- i18n ---------------- */
  const STR = {
    en: {
      docTitle: "Henry's Arcade",
      speechLang: "en-US",
      tagline: "PICK A GAME! TAP ANYTHING!",
      home: "HOME",
      titles:  { shapes:"SHAPES!", colors:"COLORS!", numbers:"COUNT!", sounds:"SOUNDS!", letters:"LETTERS!", draw:"DRAW!", train:"TRAIN!" },
      tiles:   { shapes:"SHAPES", colors:"COLORS", numbers:"COUNT", sounds:"SOUNDS", letters:"LETTERS", draw:"DRAW", train:"TRAIN" },
      hints:   { shape:"TAP A SHAPE", color:"TAP A COLOR", number:"TAP A NUMBER", sound:"TAP TO MAKE NOISE", letter:"TAP A LETTER" },
      shapeNames: { circle:"CIRCLE", square:"SQUARE", triangle:"TRIANGLE", star:"STAR", heart:"HEART", diamond:"DIAMOND" },
      colorNames: { red:"RED", orange:"ORANGE", yellow:"YELLOW", green:"GREEN", blue:"BLUE", purple:"PURPLE", pink:"PINK", brown:"BROWN" },
      numWords: ["ONE","TWO","THREE","FOUR","FIVE","SIX","SEVEN","EIGHT","NINE","TEN"],
      soundNames: { honk:"HONK", drum:"DRUM", zap:"ZAP", cheer:"CHEER" },
      clearLabel: "CLEAR",
      saveLabel: "SAVE",
      savedMsg: "SAVED!",
      ctrl: { back:"BACK", stop:"STOP", fwd:"GO", whistle:"WHISTLE!" },
      parent: { title:"PLAY TIME", start:"START", stop:"STOP TIMER", noLimit:"NO LIMIT" }
    },
    de: {
      docTitle: "Henrys Arcade",
      speechLang: "de-DE",
      tagline: "WÄHL EIN SPIEL! TIPP ÜBERALL!",
      home: "HAUS",
      titles:  { shapes:"FORMEN!", colors:"FARBEN!", numbers:"ZÄHLEN!", sounds:"GERÄUSCHE!", letters:"BUCHSTABEN!", draw:"MALEN!", train:"ZUG!" },
      tiles:   { shapes:"FORMEN", colors:"FARBEN", numbers:"ZÄHLEN", sounds:"GERÄUSCHE", letters:"BUCHSTABEN", draw:"MALEN", train:"ZUG" },
      hints:   { shape:"TIPP EINE FORM", color:"TIPP EINE FARBE", number:"TIPP EINE ZAHL", sound:"TIPPEN FÜR KNALL", letter:"TIPP EINEN BUCHSTABEN" },
      shapeNames: { circle:"KREIS", square:"QUADRAT", triangle:"DREIECK", star:"STERN", heart:"HERZ", diamond:"RAUTE" },
      colorNames: { red:"ROT", orange:"ORANGE", yellow:"GELB", green:"GRÜN", blue:"BLAU", purple:"LILA", pink:"PINK", brown:"BRAUN" },
      numWords: ["EINS","ZWEI","DREI","VIER","FÜNF","SECHS","SIEBEN","ACHT","NEUN","ZEHN"],
      soundNames: { honk:"TUT", drum:"TROMMEL", zap:"ZISCH", cheer:"JUBEL" },
      clearLabel: "LÖSCHEN",
      saveLabel: "SICHERN",
      savedMsg: "GESICHERT!",
      ctrl: { back:"ZURÜCK", stop:"STOPP", fwd:"LOS", whistle:"PFEIFE!" },
      parent: { title:"SPIELZEIT", start:"START", stop:"TIMER STOPPEN", noLimit:"KEIN LIMIT" }
    }
  };
  let lang = localStorage.getItem("slimeLang");
  if(lang !== "en" && lang !== "de"){
    lang = (navigator.language || "").toLowerCase().indexOf("de") === 0 ? "de" : "en";
  }
  const t = () => STR[lang];

  /* ---------------- audio ---------------- */
  let ctx = null, masterBus = null, reverbSend = null;
  function ac(){
    if(!ctx){
      try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
      buildMasterBus();
    }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  /* A light compressor (glues overlapping sounds together, stops clipping
     when e.g. ten counting-blips fire at once) plus a small synthetic-room
     reverb send, shared by every tone()/noise() call -- one change that
     makes the whole app's sound design read as more "produced" instead of
     a bunch of dry beeps. */
  function buildMasterBus(){
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.knee.value = 22;
    comp.ratio.value = 3.2;
    comp.attack.value = 0.006;
    comp.release.value = 0.18;
    comp.connect(ctx.destination);
    masterBus = comp;

    const dur = 1.3, decay = 2.8;
    const len = Math.floor(ctx.sampleRate * dur);
    const impulse = ctx.createBuffer(2, len, ctx.sampleRate);
    for(let ch=0; ch<2; ch++){
      const data = impulse.getChannelData(ch);
      for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
    }
    const convolver = ctx.createConvolver();
    convolver.buffer = impulse;
    const wet = ctx.createGain();
    wet.gain.value = 0.15;
    convolver.connect(wet);
    wet.connect(masterBus);
    reverbSend = convolver;
  }
  function tone(opts){
    const a = ac(); if(!a) return;
    const tm = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = opts.type || "sine";
    o.frequency.setValueAtTime(opts.f, tm + (opts.at||0));
    if(opts.to) o.frequency.exponentialRampToValueAtTime(opts.to, tm + (opts.at||0) + (opts.dur||.3));
    g.gain.setValueAtTime(0.0001, tm + (opts.at||0));
    g.gain.exponentialRampToValueAtTime(opts.vol||0.28, tm + (opts.at||0) + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, tm + (opts.at||0) + (opts.dur||.3));
    o.connect(g);
    g.connect(masterBus || a.destination);
    if(reverbSend) g.connect(reverbSend);
    o.start(tm + (opts.at||0)); o.stop(tm + (opts.at||0) + (opts.dur||.3) + .05);
  }
  function noise(dur, at, filterFreq, vol){
    const a = ac(); if(!a) return;
    const tm = a.currentTime + (at||0);
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type="lowpass"; f.frequency.value = filterFreq||1400;
    const g = a.createGain(); g.gain.value = vol != null ? vol : 0.4;
    src.connect(f); f.connect(g);
    g.connect(masterBus || a.destination);
    if(reverbSend) g.connect(reverbSend);
    src.start(tm);
  }

  /* ---------------- speech ---------------- */
  let voiceList = [];
  function refreshVoices(){ voiceList = speechSynthesis.getVoices() || []; }
  if("speechSynthesis" in window){
    refreshVoices();
    speechSynthesis.addEventListener("voiceschanged", refreshVoices);
  }
  function pickVoice(langPrefix){
    const matches = voiceList.filter(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix));
    const pool = matches.length ? matches : voiceList;
    if(!pool.length) return null;
    // Every platform ships at least one low-effort robotic "compact" voice
    // alongside better ones; prefer names that flag a higher-quality engine.
    const qualityRe = /(natural|neural|enhanced|premium|google)/i;
    return pool.find(v => qualityRe.test(v.name)) || pool[0];
  }
  function say(text){
    if(!("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = t().speechLang;
      const v = pickVoice(lang === "de" ? "de" : "en");
      if(v) u.voice = v;
      u.rate = .92; u.pitch = 1.05; u.volume = 1;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---------------- particles ---------------- */
  function burst(x, y, colors, count){
    if(reduced) return;
    const n = count || 12;
    for(let i=0;i<n;i++){
      const b = document.createElement("div");
      b.className = "bit";
      const size = 10 + Math.random()*26;
      const col = colors[Math.floor(Math.random()*colors.length)];
      b.style.cssText = "width:"+size+"px;height:"+size+"px;background:"+col+";left:"+(x-size/2)+"px;top:"+(y-size/2)+"px;";
      document.body.appendChild(b);
      const ang = Math.random()*Math.PI*2, dist = 60 + Math.random()*190;
      b.animate([
        {transform:"translate(0,0) scale(.4) rotate(0deg)", opacity:1},
        {transform:"translate("+Math.cos(ang)*dist+"px,"+(Math.sin(ang)*dist+90)+"px) scale(1.1) rotate("+(Math.random()*540-270)+"deg)", opacity:0}
      ], {duration: 750 + Math.random()*450, easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish = () => b.remove();
    }
  }
  function centerOf(el){
    const r = el.getBoundingClientRect();
    return {x:r.left + r.width/2, y:r.top + r.height/2};
  }

  /* ---------------- wallpaper splats ---------------- */
  document.querySelectorAll("[data-splats]").forEach(function(box){
    for(let i=0;i<14;i++){
      const s = document.createElement("span");
      const size = 40 + Math.random()*150;
      s.style.cssText = "width:"+size+"px;height:"+size+"px;background:"+PALETTE[i%PALETTE.length]+
        ";left:"+(Math.random()*100)+"%;top:"+(Math.random()*100)+"%;animation-delay:"+(-Math.random()*9)+"s;opacity:"+(0.25+Math.random()*0.4);
      box.appendChild(s);
    }
  });

  /* ---------------- forgiving taps ---------------- */
  /* Toddlers' fingers wobble mid-press, which makes browsers cancel the
     synthetic "click" event (it treats the wobble as a scroll gesture).
     pointerdown fires the instant contact happens and ignores movement. */
  function onTap(el, handler){
    el.addEventListener("pointerdown", function(e){
      if(e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();
      handler(e);
    }, {passive:false});
  }

  /* ---------------- navigation ---------------- */

  }

  function at(len){ return pathEl.getPointAtLength(((len % pathLen) + pathLen) % pathLen); }

  function placeOne(veh, lenAt){
    const v = veh.v;
    const pA = at(lenAt + (v.axleA - v.w/2) * scale);
    const pB = at(lenAt + (v.axleB - v.w/2) * scale);
    const deg = Math.atan2(pB.y - pA.y, pB.x - pA.x) * 180 / Math.PI;
    const mx = (v.axleA + v.axleB) / 2;
    veh.el.style.transform =
      "translate(" + ((pA.x+pB.x)/2) + "px," + ((pA.y+pB.y)/2) + "px) " +
      "rotate(" + deg + "deg) scale(" + scale + ") " +
      "translate(" + (-mx) + "px," + (-RAIL_Y) + "px)";
  }

  function place(){
    if(!pathEl) return;
    vehicles.forEach(function(veh){
      placeOne(veh, (headLen - veh.offsetPx * scale + pathLen * 4) % pathLen);
    });
  }

  function setWheelSpeed(){
    const dur = trainDirection === 0 ? "0.9s" : (1.1 - (trainSpeed / 100) * 0.75) + "s";
    const dir = trainDirection < 0 ? "reverse" : "normal";
    document.querySelectorAll("#trainStage .wspin").forEach(function(w){
      w.style.animationDuration = dur;
      w.style.animationDirection = dir;
    });
  }

  function trainStep(ts){
    if(!pathEl){ trainRafId = requestAnimationFrame(trainStep); return; }
    if(trainLastTs == null) trainLastTs = ts;
    const dt = Math.min(0.05, (ts - trainLastTs) / 1000);
    trainLastTs = ts;
    if(trainDirection !== 0){
      headLen = (headLen + trainDirection * SPEED_PX * (trainSpeed/100) * dt + pathLen * 4) % pathLen;
      place();
      chuffAccum += dt;
      const chuffEvery = 0.55 - (trainSpeed / 100) * 0.4;
      if(chuffAccum >= chuffEvery){
        chuffAccum = 0;
        noise(.08, 0, 500);
        tone({f:90, dur:.08, type:"sine", vol:.15});
        const stack = vehicles[0].el.querySelector(".l-stack-flare");
        if(stack && !reduced){
          const r = stack.getBoundingClientRect();
          const size = (9 + Math.random()*7) * scale * 2;
          const puffEl = document.createElement("div");
          puffEl.className = "puff";
          const sr = trainStage.getBoundingClientRect();
          puffEl.style.cssText = "width:"+size+"px;height:"+size+"px;left:"+(r.left+r.width/2-sr.left-size/2)+"px;top:"+(r.top+r.height/2-sr.top-size/2)+"px;opacity:.75";
          trainStage.appendChild(puffEl);
          puffEl.animate([
            {transform:"translate(0,0) scale(.6)", opacity:.7},
            {transform:"translate("+(Math.random()*16-8)+"px,"+(-26-Math.random()*18)+"px) scale(1.7)", opacity:0}
          ], {duration:1200+Math.random()*500, easing:"ease-out"}).onfinish = function(){ puffEl.remove(); };
        }
      }
    }
    trainRafId = requestAnimationFrame(trainStep);
  }
  function startTrainLoop(){
    if(trainRafId != null) return;
    trainLastTs = null;
    trainRafId = requestAnimationFrame(trainStep);
  }
  function stopTrainLoop(){
    if(trainRafId != null){ cancelAnimationFrame(trainRafId); trainRafId = null; }
  }
  function setTrainDirection(dir){
    trainDirection = dir;
    const running = dir !== 0;
    trainStage.classList.toggle("running", running);
    setWheelSpeed();
    if(dir !== 0) tone({f:340, to:520, dur:.18, type:"triangle", vol:.18});
  }
  onTap($("#btnFwd"), function(){ setTrainDirection(1); });
  onTap($("#btnStop"), function(){ setTrainDirection(0); tone({f:260, to:120, dur:.2, type:"square", vol:.2}); });
  onTap($("#btnBack"), function(){ setTrainDirection(-1); });
  onTap($("#btnWhistle"), function(){
    tone({f:349, dur:.6, type:"sawtooth", vol:.22});
    tone({f:415, dur:.6, type:"sawtooth", vol:.18});
    tone({f:349, at:.65, dur:.5, type:"sawtooth", vol:.22});
    tone({f:415, at:.65, dur:.5, type:"sawtooth", vol:.18});
    const stack = vehicles[0].el.querySelector(".l-stack-flare") || vehicles[0].el;
    const r = stack.getBoundingClientRect();
    burst(r.left + r.width/2, r.top, ["#fff","#e8e8e8","#cfcfcf"], 22);
  });
  const speedSlider = $("#speedSlider");
  trainSpeed = parseInt(speedSlider.value, 10);
  speedSlider.addEventListener("input", function(){
    trainSpeed = parseInt(speedSlider.value, 10);
    setWheelSpeed();
  });
  window.addEventListener("resize", function(){
    if($("#train").classList.contains("on")) layoutTrack();
    if($("#draw").classList.contains("on")) fitCanvas();
  });

  /* ---------------- PARENT MODE ---------------- */
  const parentLock = $("#parentLock"), parentModal = $("#parentModal");
  const parentPie = $("#parentPie"), parentFade = $("#parentFade");
  const chipRow = $("#chipRow"), parentStart = $("#parentStart"), parentStop = $("#parentStop");
  const FADE_MS = 10000; // last 10 seconds fade to black
  let selectedMin = null, sessionEndAt = null, sessionTotalMs = 0, parentTickId = null;

  function openParentModal(){
    parentModal.classList.add("on");
    parentStop.classList.toggle("show", sessionEndAt != null);
    tone({f:520, to:700, dur:.18, type:"sine", vol:.18});
  }
  function closeParentModal(){ parentModal.classList.remove("on"); }
  onTap($("#parentClose"), closeParentModal);
  document.addEventListener("pointerdown", function(e){
    if(e.target === parentModal) closeParentModal();
  });

  chipRow.querySelectorAll(".chip").forEach(function(chip){
    onTap(chip, function(){
      selectedMin = parseInt(chip.dataset.min, 10);
      chipRow.querySelectorAll(".chip").forEach(c => c.classList.toggle("selected", c === chip));
      tone({f:440, dur:.1, type:"sine", vol:.15});
    });
  });

  function endParentSession(){
    if(parentTickId != null){ clearInterval(parentTickId); parentTickId = null; }
    sessionEndAt = null;
    parentPie.classList.remove("show");
    parentFade.style.opacity = "0";
  }
  function tickParentSession(){
    if(sessionEndAt == null) return;
    const remaining = sessionEndAt - Date.now();
    if(remaining <= 0){
      parentFade.style.opacity = "1";
      // Time's up: quiet everything down, but stay locked -- a parent has
      // to hold the lock icon again to open the modal and resume play.
      if(typeof stopDrawTone === "function") stopDrawTone();
      if(typeof stopTrainLoop === "function") stopTrainLoop();
      if("speechSynthesis" in window) speechSynthesis.cancel();
      if(parentTickId != null){ clearInterval(parentTickId); parentTickId = null; }
      sessionEndAt = null;
      parentPie.classList.remove("show");
      return;
    }
    const frac = Math.max(0, Math.min(1, remaining / sessionTotalMs));
    parentPie.style.background =
      "conic-gradient(var(--slime) 0% " + (frac*100) + "%, rgba(255,255,255,.4) " + (frac*100) + "% 100%)";
    parentFade.style.opacity = String(Math.max(0, Math.min(1, (FADE_MS - remaining) / FADE_MS)));
  }
  onTap(parentStart, function(){
    const minutes = selectedMin || 10;
    sessionTotalMs = minutes * 60000;
    sessionEndAt = Date.now() + sessionTotalMs;
    parentFade.style.opacity = "0";
    parentPie.classList.add("show");
    if(parentTickId != null) clearInterval(parentTickId);
    parentTickId = setInterval(tickParentSession, 250);
    tickParentSession();
    closeParentModal();
    tone({f:660, to:990, dur:.25, type:"triangle", vol:.2});
  });
  onTap(parentStop, function(){
    endParentSession();
    closeParentModal();
    tone({f:520, to:260, dur:.2, type:"square", vol:.18});
  });

  // Press-and-hold, not a plain tap, so a curious toddler mashing buttons
  // can't stumble into the parent controls by accident.
  let lockPressTimer = null;
  parentLock.addEventListener("pointerdown", function(e){
    e.preventDefault();
    clearTimeout(lockPressTimer);
    lockPressTimer = setTimeout(openParentModal, 900);
  }, {passive:false});
  ["pointerup","pointercancel","pointerleave"].forEach(function(evt){
    parentLock.addEventListener(evt, function(){ clearTimeout(lockPressTimer); });
  });

  /* ---------------- language ---------------- */
  function applyLang(){
    const d = t();
    document.documentElement.lang = lang;
    document.title = d.docTitle;
    document.querySelectorAll("[data-tagline]").forEach(el => el.textContent = d.tagline);
    document.querySelectorAll("[data-home]").forEach(el => el.textContent = d.home);
    document.querySelectorAll("[data-title]").forEach(el => el.textContent = d.titles[el.dataset.title]);
    document.querySelectorAll("[data-tile]").forEach(el => el.textContent = d.tiles[el.dataset.tile]);
    shapeWord.textContent = d.hints.shape;
    colorWord.textContent = d.hints.color;
    numWord.textContent = d.hints.number;
    soundWord.textContent = d.hints.sound;
    letterWord.textContent = d.hints.letter;
    document.querySelectorAll("[data-clear]").forEach(el => el.textContent = d.clearLabel);
    document.querySelectorAll("[data-save]").forEach(el => el.textContent = d.saveLabel);
    document.querySelectorAll("[data-parent]").forEach(el => el.textContent = d.parent[el.dataset.parent]);
    document.querySelectorAll("[data-ctrl]").forEach(el => el.textContent = d.ctrl[el.dataset.ctrl]);
    shapeBtns.forEach(o => o.btn.setAttribute("aria-label", d.shapeNames[o.key]));
    colorBtns.forEach(o => o.btn.setAttribute("aria-label", d.colorNames[o.key]));
    document.querySelectorAll(".langSwitch button").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.lang === lang);
    });
  }
  function setLang(next){
    if(next !== "en" && next !== "de") return;
    lang = next;
    localStorage.setItem("slimeLang", lang);
    applyLang();
    tone({f:520, to:780, dur:.15, type:"triangle", vol:.2});
  }
  applyLang();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("/sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
