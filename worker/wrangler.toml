name = "poolman-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

kv_namespaces = [
  { binding = "SESSIONS", id = "dc4b5f6d1f2e42b7b6f616b0324af8be" }
]

[vars]
# Origin allowed to call this Worker with credentials (your Webflow site).
ALLOWED_ORIGIN = "https://reflectingpool.us"
# Cookie domain shared between the Worker's subdomain and the Webflow site.
SESSION_COOKIE_DOMAIN = ".reflectingpool.us"

# --- Webflow config ---
WEBFLOW_SITE_ID = "6a6bc31c187a9da9577f9733"
WEBFLOW_COLLECTION_ID = "6a6bc9f8ccc5c3af78c6e78c"
PHOTO_FIELD_SLUG = "photo"
DATE_FIELD_SLUG = "date"
STATUS_FIELD_SLUG = "status"

# --- Secrets (never put these here) ---
# Set with `wrangler secret put <NAME>`:
#   AUTH_PAIRS         e.g. "admin:admin,Poolman:Washington"
#   WEBFLOW_API_TOKEN   Webflow API token with CMS read/write + Assets scope

# Bind this Worker to a subdomain of the same zone Webflow serves the site on,
# so the session cookie (Domain=.reflectingpool.us) is visible to both.
# custom_domain = true makes wrangler auto-create the DNS record + cert on
# deploy -- a plain [routes] pattern does NOT create DNS, which is why
# api.reflectingpool.us didn't resolve when it was only added as a manual
# dashboard route. Remove that manual route in the dashboard before
# deploying this (Workers & Pages > poolman-worker > Settings > Domains &
# Routes) so the two don't conflict.
[[routes]]
pattern = "api.reflectingpool.us"
custom_domain = true
